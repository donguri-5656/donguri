<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Text from URL Parameter</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #222; /* 背景色 */
            overflow: hidden; /* 落下する文字が画面外に消えるように */
        }

        #text-container {
            position: relative;
            display: flex; /* 文字を横並びにする */
            font-size: 48px; /* 文字サイズ */
            font-weight: bold;
            color: #fff; /* 文字色 */
            font-family: Arial, sans-serif;
            z-index: 10;
        }

        .falling-char {
            display: inline-block;
            position: relative; /* transformの基準 */
            opacity: 0; /* 初期状態では非表示 */
            /* アニメーションの定義 (JavaScriptで追加される) */
            transition: transform 1.5s ease-in, opacity 0.5s;
        }

        .fall {
            opacity: 1;
            transform: translateY(100vh) rotate(360deg); /* 画面下部まで移動し、回転 */
        }
    </style>
</head>
<body>

    <div id="text-container"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('text-container');
            
            // 1. URLパラメータから 'text' の値を取得
            const params = new URLSearchParams(window.location.search);
            let inputText = params.get('text');

            // パラメータがない場合、デフォルトのテキストを使用
            if (!inputText) {
                inputText = "Hello, World!"; 
                container.textContent = "URLパラメータがないため、デフォルトのテキストを使用します。例: ?text=FALLING%20TEXT";
                container.style.fontSize = "20px";
                container.style.color = "#ccc";
                return; // ここで処理を終了
            }

            // 2. 文字列を一文字ずつ<span>要素としてDOMに追加
            const chars = inputText.split('');
            container.textContent = ''; // デフォルトメッセージをクリア
            
            chars.forEach((char, index) => {
                const span = document.createElement('span');
                span.textContent = char === ' ' ? '\u00A0' : char; // スペースは\u00A0 (非改行スペース)に変換
                span.classList.add('falling-char');
                span.style.transform = `translateY(-100vh)`; // 初期位置を画面外の上部に設定
                span.style.left = `${Math.random() * 20 - 10}px`; // 各文字にわずかな水平方向のランダムなずれを設定

                // 落下開始のタイミングをずらす
                const delay = index * 100 + Math.random() * 200; // 0.1秒ずつ遅延 + ランダムなずれ
                span.style.transitionDelay = `${delay}ms`;

                container.appendChild(span);

                // 3. 遅延後に落下アニメーションを開始
                // transformが初期位置から最終位置へスムーズに変化するためにsetTimeoutで少し待つ
                setTimeout(() => {
                    span.classList.add('fall');
                }, delay + 50); // delay + 50ms後にfallクラスを追加してアニメーション開始
            });

            // 4. アニメーション終了後に要素を削除（オプション）
            const lastDelay = (chars.length - 1) * 100 + 200; 
            setTimeout(() => {
                // アニメーションが完了する時間を考慮して、全ての文字を透明にする
                document.querySelectorAll('.falling-char').forEach(span => {
                    span.style.opacity = 0;
                });
            }, lastDelay + 1500); // 最後の文字が落ち始めてから1.5秒後

        });
    </script>

</body>
</html>
