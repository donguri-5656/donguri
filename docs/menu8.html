<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字おくりサイト (X.gd + Cloudflare Worker)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        #message-display {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            padding: 20px 0;
            word-wrap: break-word;
        }
        #message-box {
            border: 1px solid #ccc;
            background-color: #eee;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 20px auto;
            padding: 15px;
            width: fit-content;
            border: 1px solid #007bff;
            border-radius: 4px;
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        #generate-button {
            background-color: #28a745;
            color: white;
        }
        #generate-button:hover {
            background-color: #218838;
        }
        #copy-button {
            background-color: #17a2b8;
            color: white;
            margin-top: 10px;
        }
        #copy-button:hover {
            background-color: #138496;
        }
        .worker-info {
            font-size: 12px;
            color: #6c757d;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="main-title">文字おくり & QRコード作成</h1>

        <div id="result-mode" style="display: none;">
            <p>送られてきたメッセージ:</p>
            <div id="message-box">
                <div id="message-display"></div>
            </div>
            <button id="copy-button">メッセージをコピー</button>
        </div>

        <div id="input-mode" style="display: none;">
            <p>送りたいメッセージを入力してください:</p>
            <input type="text" id="input-text" placeholder="ここにメッセージを入力">
            <button id="generate-button">URLを生成してQRコードを作成</button>
            
            <p style="margin-top: 20px;">生成されたQRコード:</p>
            <div id="qrcode"></div>
            <p id="short-url-display" style="font-size: 14px; word-wrap: break-word;"></p>
            <p class="worker-info">※URL短縮には、デプロイ済みのCloudflare Workerを経由しています。</p>
        </div>
    </div>

    <script>
        // 【重要】デプロイしたCloudflare WorkerのURL
        const WORKER_URL = 'https://urlshort.donguri5656-1209.workers.dev'; 
        const MESSAGE_PARAM_KEY = 'text';

        // 1. URLパラメーターのチェックとモードの切り替え
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get(MESSAGE_PARAM_KEY);
        
        if (message) {
            initResultMode(message);
        } else {
            initInputMode();
        }

        // ===================================================
        // Worker経由でのURL短縮関数
        // ===================================================
        async function shortenUrlWithXgd(longUrl) {
            const proxyUrl = `${WORKER_URL}?targetUrl=${encodeURIComponent(longUrl)}`;
            
            try {
                const response = await fetch(proxyUrl);
                const resultText = await response.text();

                // Workerが成功した短縮URLをプレーンテキストで返す場合
                if (response.ok && resultText.startsWith('http')) {
                    return resultText;
                } 
                
                // Workerがエラー情報（テキスト）を返した場合
                else {
                    console.error('Worker/X.gd APIエラー:', resultText);
                    alert(`URL短縮に失敗しました。元の長いURLでQRコードを作成します。\n詳細: ${resultText}`);
                    return longUrl; 
                }
            } catch (error) {
                console.error('Worker呼び出しエラー:', error);
                alert('Workerへの接続に失敗しました。ネットワーク接続を確認してください。\n元の長いURLでQRコードを作成します。');
                return longUrl; 
            }
        }

        // ===================================================
        // 【モード1】パラメーターありの場合の処理
        // ===================================================
        function initResultMode(encodedMessage) {
            document.getElementById('result-mode').style.display = 'block';
            
            const decodedMessage = decodeURIComponent(encodedMessage);
            document.getElementById('message-display').textContent = decodedMessage;

            document.getElementById('copy-button').addEventListener('click', () => {
                navigator.clipboard.writeText(decodedMessage).then(() => {
                    alert('メッセージがコピーされました:\n' + decodedMessage);
                }).catch(err => {
                    console.error('コピーに失敗しました', err);
                    alert('コピーに失敗しました。お手数ですが手動でコピーしてください。');
                });
            });
        }

        // ===================================================
        // 【モード2】パラメーターなしの場合の処理 (修正箇所)
        // ===================================================
        function initInputMode() {
            document.getElementById('input-mode').style.display = 'block';
            const inputText = document.getElementById('input-text');
            const generateButton = document.getElementById('generate-button');

            generateButton.addEventListener('click', async () => {
                const text = inputText.value.trim();
                if (!text) {
                    alert('メッセージを入力してください。');
                    return;
                }

                generateButton.textContent = '短縮中...';
                generateButton.disabled = true;

                // 1. 送信用の新しい長いURLを生成
                
                // 現在のURL全体からクエリとハッシュを削除し、ファイルパス（/donguri/menu8.html）を維持
                const baseUrl = window.location.origin + window.location.pathname;
                
                // メッセージをエンコードしてURLに結合
                const encodedText = encodeURIComponent(text);
                
                // 【修正箇所】 ファイル名（menu8.html）までを含めたパスにクエリを付与
                const newLongUrl = `${baseUrl}?${MESSAGE_PARAM_KEY}=${encodedText}`;
                
                console.log("短縮対象の長いURL:", newLongUrl);

                // 2. Worker経由でURLを短縮
                const finalUrl = await shortenUrlWithXgd(newLongUrl);
                
                // 3. QRコードを生成
                generateQRCode(finalUrl);
                
                // 4. 短縮URLを表示
                document.getElementById('short-url-display').innerHTML = 
                    `短縮されたURL (QRコードの内容): <a href="${finalUrl}" target="_blank">${finalUrl}</a>`;

                generateButton.textContent = 'URLを生成してQRコードを作成';
                generateButton.disabled = false;
            });
        }

        /**
         * 指定されたURLでQRコードを生成するヘルパー関数
         */
        function generateQRCode(url) {
            const qrcodeElement = document.getElementById("qrcode");
            qrcodeElement.innerHTML = ''; 

            new QRCode(qrcodeElement, {
                text: url,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
