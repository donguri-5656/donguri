<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>落下する文字</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #000; /* 背景を黒に */
            overflow: hidden; /* スクロールバーを非表示 */
            font-family: 'Arial', sans-serif;
            font-size: 4em; /* 文字の大きさを調整 */
            color: #0f0; /* 文字色を緑に（マトリックス風） */
        }

        .char-container {
            display: flex;
            position: relative;
        }

        .falling-char {
            display: inline-block;
            position: relative;
            opacity: 0; /* 初期状態では透明 */
            transform: translateY(-100vh); /* 画面上部外側に配置 */
        }

        /* 落下アニメーションの定義 */
        @keyframes fall {
            0% {
                opacity: 0;
                transform: translateY(-100vh) scale(1);
            }
            20% {
                opacity: 1;
                transform: translateY(0) scale(1.1); /* 少しバウンドさせる */
            }
            80% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .falling-char.animate {
            /* JavaScriptでanimationプロパティを設定するため、ここではキーフレーム名のみ定義 */
        }
    </style>
</head>
<body>
    <div id="text-container" class="char-container">
        </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('text-container');
            
            // 1. URLからクエリパラメーターを取得
            const urlParams = new URLSearchParams(window.location.search);
            // 'text'パラメーターの値を取得。ない場合はデフォルトの文字列を使用。
            // URLデコードも自動で行われます。
            let textToDisplay = urlParams.get('text');

            if (!textToDisplay || textToDisplay.trim() === '') {
                textToDisplay = 'NO TEXT PARAMETER'; // パラメーターがない場合のデフォルト
            }

            const characters = textToDisplay.split('');
            const baseDuration = 1.5; // 基本の落下時間（秒）
            const delayIncrement = 0.1; // 一文字あたりの遅延増加量（秒）

            // 2. 文字列を一文字ずつ分割し、DOM要素として追加
            characters.forEach((char, index) => {
                const charElement = document.createElement('span');
                charElement.className = 'falling-char';
                
                // スペースの場合は透明なままアニメーション対象外にする
                if (char === ' ') {
                    charElement.innerHTML = '&nbsp;'; // HTMLスペース
                    // スペースはアニメーションさせずにそのまま表示
                    charElement.style.opacity = '1';
                } else {
                    charElement.textContent = char;
                    
                    // アニメーションを個別に設定
                    const delay = index * delayIncrement;
                    charElement.style.animation = `fall ${baseDuration}s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards ${delay}s`;
                    charElement.classList.add('animate');
                }

                container.appendChild(charElement);
            });
        });
    </script>
</body>
</html>
