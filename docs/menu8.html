<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字おくりサイト (X.gd利用)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        #message-display {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
            padding: 20px 0;
            word-wrap: break-word;
        }
        #message-box {
            border: 1px solid #ccc;
            background-color: #eee;
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        #qrcode {
            margin: 20px auto;
            padding: 15px;
            width: fit-content;
            border: 1px solid #007bff;
            border-radius: 4px;
        }
        input[type="text"] {
            width: calc(100% - 22px);
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        #generate-button {
            background-color: #28a745;
            color: white;
        }
        #generate-button:hover {
            background-color: #218838;
        }
        #copy-button {
            background-color: #17a2b8;
            color: white;
            margin-top: 10px;
        }
        #copy-button:hover {
            background-color: #138496;
        }
        .caution {
            color: red;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="main-title">文字おくり & QRコード作成</h1>

        <div id="result-mode" style="display: none;">
            <p>送られてきたメッセージ:</p>
            <div id="message-box">
                <div id="message-display"></div>
            </div>
            <button id="copy-button">メッセージをコピー</button>
        </div>

        <div id="input-mode" style="display: none;">
            <p>送りたいメッセージを入力してください:</p>
            <input type="text" id="input-text" placeholder="ここにメッセージを入力">
            <button id="generate-button">URLを生成してQRコードを作成</button>
            
            <p style="margin-top: 20px;">生成されたQRコード:</p>
            <div id="qrcode"></div>
            <p id="short-url-display" style="font-size: 14px; word-wrap: break-word;"></p>
            <p class="caution">※APIキーを公開しているため、短縮機能が動作しない、またはキーが悪用されるリスクがあります。</p>
        </div>
    </div>

    <script>
        // X.gd APIキー (一時的に公開)
        const XGD_API_KEY = '93c773ab783637b93b2043cb8ef1bc85';
        const MESSAGE_PARAM_KEY = 'text';

        // 1. URLパラメーターのチェックとモードの切り替え
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get(MESSAGE_PARAM_KEY);
        
        if (message) {
            // パラメーターあり: メッセージ表示モード
            initResultMode(message);
        } else {
            // パラメーターなし: 入力・生成モード
            initInputMode();
        }

        // ===================================================
        // X.gd短縮APIの関数 (CORSにより失敗する可能性あり)
        // ===================================================
        /**
         * X.gdのAPIを使ってURLを短縮します。
         */
        async function shortenUrlWithXgd(longUrl) {
            const apiEndpoint = `https://x.gd/api.php?url=${encodeURIComponent(longUrl)}&key=${XGD_API_KEY}`;
            
            try {
                // API呼び出しの実行
                const response = await fetch(apiEndpoint);
                const shortUrl = await response.text();

                if (shortUrl.startsWith('http')) {
                    return shortUrl;
                } else {
                    console.error('X.gd APIエラー:', shortUrl);
                    // エラー時は元の長いURLを返す
                    return longUrl; 
                }
            } catch (error) {
                console.error('API呼び出しエラー (CORS/ネットワーク):', error);
                // ネットワークエラー時も元の長いURLを返す
                return longUrl; 
            }
        }

        // ===================================================
        // 【モード1】パラメーターありの場合の処理
        // ===================================================
        function initResultMode(encodedMessage) {
            document.getElementById('result-mode').style.display = 'block';
            
            const decodedMessage = decodeURIComponent(encodedMessage);
            document.getElementById('message-display').textContent = decodedMessage;

            // コピーボタンの処理
            document.getElementById('copy-button').addEventListener('click', () => {
                navigator.clipboard.writeText(decodedMessage).then(() => {
                    alert('メッセージがコピーされました:\n' + decodedMessage);
                }).catch(err => {
                    console.error('コピーに失敗しました', err);
                    alert('コピーに失敗しました。お手数ですが手動でコピーしてください。');
                });
            });
        }

        // ===================================================
        // 【モード2】パラメーターなしの場合の処理
        // ===================================================
        function initInputMode() {
            document.getElementById('input-mode').style.display = 'block';
            const inputText = document.getElementById('input-text');
            const generateButton = document.getElementById('generate-button');

            generateButton.addEventListener('click', async () => {
                const text = inputText.value.trim();
                if (!text) {
                    alert('メッセージを入力してください。');
                    return;
                }

                generateButton.textContent = '短縮中...';
                generateButton.disabled = true;

                // 1. 送信用の新しい長いURLを生成
                // GitHub Pagesではパスがリポジトリ名を含むため、window.location.href全体をベースにします
                const baseUrl = window.location.href.split('?')[0].split('#')[0];
                const encodedText = encodeURIComponent(text);
                const newLongUrl = `${baseUrl}?${MESSAGE_PARAM_KEY}=${encodedText}`;

                // 2. X.gdでURLを短縮
                const finalUrl = await shortenUrlWithXgd(newLongUrl);
                
                // 3. QRコードを生成
                generateQRCode(finalUrl);
                
                // 4. 短縮URLを表示
                document.getElementById('short-url-display').innerHTML = 
                    `短縮されたURL (QRコードの内容): <a href="${finalUrl}" target="_blank">${finalUrl}</a>`;

                generateButton.textContent = 'URLを生成してQRコードを作成';
                generateButton.disabled = false;
            });
        }

        /**
         * 指定されたURLでQRコードを生成するヘルパー関数
         */
        function generateQRCode(url) {
            const qrcodeElement = document.getElementById("qrcode");
            // 既存のQRコードをクリア
            qrcodeElement.innerHTML = ''; 

            new QRCode(qrcodeElement, {
                text: url,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });
        }
    </script>
</body>
</html>
