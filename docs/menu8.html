<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X.gd Worker テスト</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; min-height: 50px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <h1>X.gd Worker 疎通テスト</h1>
    <p>GoogleのURLを短縮します。</p>
    <p>対象URL: <strong id="long-url">https://www.google.com/search?q=hello</strong></p>
    <button id="test-button">Worker経由で短縮を実行</button>
    
    <h2>結果</h2>
    <div id="result">
        短縮結果がここに表示されます。
    </div>

    <script>
        // 【重要】デプロイしたCloudflare WorkerのURL
        const WORKER_URL = 'https://urlshort.donguri5656-1209.workers.dev'; 
        const testButton = document.getElementById('test-button');
        const resultDiv = document.getElementById('result');
        const longUrl = document.getElementById('long-url').textContent;

        testButton.addEventListener('click', async () => {
            resultDiv.innerHTML = "短縮処理中...";
            testButton.disabled = true;

            // Workerに渡すためのURLを構築
            // longUrl全体をエンコードする
            const proxyUrl = `${WORKER_URL}?targetUrl=${encodeURIComponent(longUrl)}`;
            
            console.log("WorkerへのリクエストURL:", proxyUrl);

            try {
                // Worker経由でAPI呼び出し
                const response = await fetch(proxyUrl);
                const shortUrl = await response.text();

                if (response.ok && shortUrl.startsWith('http')) {
                    // 成功
                    resultDiv.innerHTML = `✅ 成功! <br> 短縮URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;
                    console.log("短縮成功:", shortUrl);
                } else {
                    // 失敗 (404やその他のエラー)
                    resultDiv.innerHTML = `❌ 失敗! (ステータス: ${response.status}) <br> Workerからの応答: ${shortUrl}`;
                    console.error('短縮失敗:', response.status, shortUrl);
                }
            } catch (error) {
                // ネットワークエラーなど
                resultDiv.innerHTML = `致命的なエラーが発生しました: ${error.message}`;
                console.error('フェッチエラー:', error);
            } finally {
                testButton.disabled = false;
                testButton.textContent = 'Worker経由で短縮を実行';
            }
        });
    </script>
</body>
</html>
