<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>String Capture Game (Fine-Tuned Replay Speed & Random Initial Strings)</title>
<style>
/* ----------------------------------------------------
   レイアウトスタイル (変更なし)
---------------------------------------------------- */
body {
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: #222;
    color: #fff;
    font-family: Arial, sans-serif;
    gap: 30px;
}
canvas {
    border: 1px solid #fff;
    background-color: #000;
}
#controls {
    display: flex;
    flex-direction: column;
    gap: 20px;
    align-items: flex-start;
    padding: 20px;
    border: 1px solid #444;
    border-radius: 8px;
    background-color: #333;
    width: 250px;
}
#controls h3 {
    margin-top: 0;
    border-bottom: 1px solid #555;
    padding-bottom: 5px;
    width: 100%;
}
#controls input[type="range"] {
    width: 120px;
}
#controls button {
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 5px;
    width: 100%;
    margin-top: 10px;
    transition: background-color 0.2s;
}
#controls button:hover {
    background-color: #5bbd5f;
}
.control-group {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 5px;
    width: 100%;
}
.control-value {
    margin-left: 10px;
    font-weight: bold;
    min-width: 25px;
}
.range-container {
    display: flex;
    align-items: center;
    width: 100%;
    justify-content: space-between;
}
/* リプレイコントロール用スタイル */
#replay-controls {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px solid #555;
    width: 100%;
}
#replay-controls button {
    width: auto;
    padding: 8px 12px;
    font-size: 14px;
    margin: 0 5px 10px 0;
}
#replay-controls .range-container {
    margin-top: 10px;
}
#replay-status {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #FFC300;
    margin-bottom: 10px;
}
</style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<div id="controls">
    <h2>🕹️ 設定メニュー</h2>
    
    <h3>🕸️ 線設定</h3>
    <div class="control-group">
        <label for="numStringsRange">初期線数 (1玉あたり):</label>
        <div class="range-container">
            <input type="range" id="numStringsRange" min="1" max="4" step="1" value="1">
            <span id="numStringsValue" class="control-value">1</span>
        </div>
    </div>
    
    <h3>⚪ 球設定</h3>
    <div class="control-group">
        <label for="numBallsRange">ボール数:</label>
        <div class="range-container">
            <input type="range" id="numBallsRange" min="2" max="8" step="1" value="4">
            <span id="numBallsValue" class="control-value">4</span>
        </div>
    </div>
    <div class="control-group">
        <label for="speedRange">🚀 全体のスピード:</label>
        <div class="range-container">
            <input type="range" id="speedRange" min="1.0" max="10" step="0.5" value="4"> 
            <span id="speedValue" class="control-value">4.0</span>
        </div>
    </div>
    
    <button id="restartButton">🔄 スタート/リセット</button>

    <div id="replay-controls">
        <h3>📼 リプレイ</h3>
        <p id="replay-status" style="color:#FFF;">---</p>

        <div class="control-group">
            <label for="replaySpeedRange">リプレイ速度:</label>
            <div class="range-container">
                <input type="range" id="replaySpeedRange" min="0.25" max="4" step="0.05" value="1">
                <span id="replaySpeedValue" class="control-value">1.00x</span>
            </div>
        </div>
        
        <div style="display:flex; justify-content:space-between;">
            <button id="toggleReplayButton">▶️ 再生 / ⏸️ 一時停止</button>
            <button id="exitReplayButton">❌ 終了</button>
        </div>
        
        <div class="control-group">
            <label>リプレイ時間 (巻き戻し/早送り):</label>
            <div class="range-container">
                <input type="range" id="replayTimeRange" min="0" max="1000" step="1" value="0" disabled>
                <span id="currentTimeDisplay">0.00s / 0.00s</span>
            </div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const CENTER_X = WIDTH / 2;
const CENTER_Y = HEIGHT / 2;
const BOUNDARY_RADIUS = 280;
const BALL_RADIUS = 7;
const INITIAL_SPEED = 5.0;
const INITIAL_COLORS = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#FFC300', '#DAF7A6', '#C70039', '#900C3F'];
const SUB_STEPS = 5; 
const TIME_STEP = 0.125; 
const TARGET_FPS = 60; 
const MS_PER_FRAME = 1000 / TARGET_FPS;

let GAME_SPEED_MULTIPLIER = 4.0;
let NUM_BALLS = 4;
let INITIAL_STRINGS_PER_BALL = 1;
let balls = [];
let animationFrameId = null;

// リプレイ用変数
let history = []; 
let frameCount = 0; 
let isGameFinished = false; 
let isReplaying = false; 
let replayFrame = 0; 
let isPaused = false; 
let replaySpeedMultiplier = 1.0; 
let lastFrameTime = 0; 
let frameRemainder = 0; 

// DOM要素 (変更なし)
const speedRange = document.getElementById('speedRange');
const speedValueSpan = document.getElementById('speedValue');
const numBallsRange = document.getElementById('numBallsRange');
const numBallsValueSpan = document.getElementById('numBallsValue');
const numStringsRange = document.getElementById('numStringsRange');
const numStringsValueSpan = document.getElementById('numStringsValue');
const restartButton = document.getElementById('restartButton');
const toggleReplayButton = document.getElementById('toggleReplayButton');
const exitReplayButton = document.getElementById('exitReplayButton');
const replayTimeRange = document.getElementById('replayTimeRange');
const currentTimeDisplay = document.getElementById('currentTimeDisplay');
const replayStatus = document.getElementById('replay-status');
const replaySpeedRange = document.getElementById('replaySpeedRange');
const replaySpeedValueSpan = document.getElementById('replaySpeedValue');

// 玉のクラス (変更なし)
class Ball {
    constructor(x, y, vx, vy, color, stringPoints) {
        this.x = x;
        this.y = y;
        this.baseVX = vx;
        this.baseVY = vy;
        this.color = color;
        this.radius = BALL_RADIUS;
        this.exists = true;
        this.stringPoints = stringPoints;
    }
    
    draw() {
        if (!this.exists) return;
        this.stringPoints.forEach(sp => {
            const stringX = CENTER_X + BOUNDARY_RADIUS * Math.cos(sp.angle);
            const stringY = CENTER_Y + BOUNDARY_RADIUS * Math.sin(sp.angle);
            ctx.beginPath();
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(stringX, stringY);
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.closePath();
        });
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.stroke();
        ctx.closePath();
    }
    
    update() {
        if (!this.exists) return;
        
        const totalMoveX = this.baseVX * GAME_SPEED_MULTIPLIER * TIME_STEP;
        const totalMoveY = this.baseVY * GAME_SPEED_MULTIPLIER * TIME_STEP;
        
        const stepMoveX = totalMoveX / SUB_STEPS;
        const stepMoveY = totalMoveY / SUB_STEPS;

        for (let i = 0; i < SUB_STEPS; i++) {
            this.x += stepMoveX;
            this.y += stepMoveY;
            this.checkBoundaryCollision();
        }
        if (this.stringPoints.length === 0) {
            this.exists = false;
        }
    }
    
    checkBoundaryCollision() {
        const dxCenter = this.x - CENTER_X;
        const dyCenter = this.y - CENTER_Y;
        const distCenter = Math.sqrt(dxCenter * dxCenter + dyCenter * dyCenter);
        
        if (distCenter + this.radius > BOUNDARY_RADIUS) {
            const normalX = dxCenter / distCenter;
            const normalY = dyCenter / distCenter;
            const dotProduct = (this.baseVX * normalX + this.baseVY * normalY);
            
            this.baseVX = this.baseVX - 2 * dotProduct * normalX;
            this.baseVY = this.baseVY - 2 * dotProduct * normalY;
            
            const overlap = (distCenter + this.radius) - BOUNDARY_RADIUS;
            this.x -= normalX * overlap;
            this.y -= normalY * overlap;
        }
    }

    checkStringCollision(ownerBall) {
        if (!ownerBall.exists || ownerBall === this) return 0;
        
        let capturedCount = 0;
        
        for (let index = ownerBall.stringPoints.length - 1; index >= 0; index--) {
            const sp = ownerBall.stringPoints[index];
            
            const stringX = CENTER_X + BOUNDARY_RADIUS * Math.cos(sp.angle);
            const stringY = CENTER_Y + BOUNDARY_RADIUS * Math.sin(sp.angle);
            
            const distToLineByThis = this.distancePointToSegment(
                this.x, this.y, ownerBall.x, ownerBall.y, stringX, stringY
            );
            
            if (distToLineByThis < this.radius && this.color !== ownerBall.color) {
                
                const thisDistToEndpoint = Math.sqrt(
                    (this.x - stringX) ** 2 + (this.y - stringY) ** 2
                );
                
                const ownerDistToEndpoint = Math.sqrt(
                    (ownerBall.x - stringX) ** 2 + (ownerBall.y - stringY) ** 2
                );
                
                if (thisDistToEndpoint < ownerDistToEndpoint) {
                    this.stringPoints.push(sp);
                    ownerBall.stringPoints.splice(index, 1);
                    capturedCount++;
                }
            }
        }
        return capturedCount;
    }
    
    distancePointToSegment(px, py, x1, y1, x2, y2) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const L2 = dx * dx + dy * dy;
        
        if(L2 === 0) return Math.sqrt((px - x1) * (px - x1) + (py - y1) * (py - y1));
        
        let t = ((px - x1) * dx + (py - y1) * dy) / L2;
        t = Math.max(0, Math.min(1, t));
        
        const closestX = x1 + t * dx;
        const closestY = y1 + t * dy;
        
        const distSq = (px - closestX) * (px - closestX) + (py - closestY) * (py - closestY);
        return Math.sqrt(distSq);
    }
}

/**
 * 毎フレーム、ゲーム状態をシリアライズして記録
 */
function recordState() {
    const state = balls.map(ball => ({
        x: ball.x,
        y: ball.y,
        baseVX: ball.baseVX,
        baseVY: ball.baseVY,
        color: ball.color,
        stringPoints: ball.stringPoints.map(sp => ({ angle: sp.angle })),
        exists: ball.exists
    }));
    history.push(state);
}

/**
 * 記録されたフレームの状態からゲーム状態を復元
 */
function restoreState(frame) {
    const historyIndex = Math.min(Math.max(0, frame), history.length - 1);

    const state = history[historyIndex];
    balls = state.map(s => {
        const ball = new Ball(s.x, s.y, s.baseVX, s.baseVY, s.color, s.stringPoints);
        ball.exists = s.exists;
        return ball;
    }).filter(ball => ball.exists);
}

/**
 * ゲームシーン（境界線とボール）を描画する
 */
function drawGameScene() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);
    ctx.beginPath();
    ctx.arc(CENTER_X, CENTER_Y, BOUNDARY_RADIUS, 0, Math.PI * 2);
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.closePath();
    balls.forEach(ball => { ball.draw(); });
}


/**
 * ゲーム初期化
 */
function init() {
    balls = [];
    history = [];
    frameCount = 0;
    isGameFinished = false;
    isReplaying = false;
    isPaused = false;
    lastFrameTime = performance.now(); 
    frameRemainder = 0; 
    
    // リプレイUIを初期化
    document.getElementById('replay-controls').style.display = 'none';
    replayTimeRange.disabled = true;
    replayStatus.textContent = "---";
    toggleReplayButton.textContent = "▶️ 再生 / ⏸️ 一時停止";
    
    // 設定値に基づいてボールを初期化
    const ballCount = NUM_BALLS;
    const stringsPerBall = INITIAL_STRINGS_PER_BALL;
    const totalStrings = ballCount * stringsPerBall;
    const angleIncrement = (2 * Math.PI) / totalStrings;
    const initialRadius = BALL_RADIUS * 4;

    // ⭐ 修正: 初期線の配置にランダムなオフセットを追加
    // Math.PI / 16 (約 11.25度) までのランダムな角度オフセット
    const globalAngleOffset = Math.random() * (Math.PI / 16); 

    for (let i = 0; i < ballCount; i++) {
        const color = INITIAL_COLORS[i % INITIAL_COLORS.length];
        const ballAngle = (2 * Math.PI) * i / ballCount;
        const initialX = CENTER_X + initialRadius * Math.cos(ballAngle);
        const initialY = CENTER_Y + initialRadius * Math.sin(ballAngle);
        let direction = Math.random() * 2 * Math.PI;
        let initialVX = INITIAL_SPEED * Math.cos(direction);
        let initialVY = INITIAL_SPEED * Math.sin(direction);
        let currentBallStrings = [];
        
        for (let j = 0; j < stringsPerBall; j++) {
            const stringIndex = i * stringsPerBall + j;
            // ⭐ 修正: 均等配置にランダムオフセットを加える
            const stringAngle = angleIncrement * stringIndex + globalAngleOffset;
            currentBallStrings.push({ angle: stringAngle, ownerColor: color });
        }
        balls.push(new Ball(initialX, initialY, initialVX, initialVY, color, currentBallStrings));
    }
    recordState();
}

/**
 * リプレイUIの更新
 */
function updateReplayUI() {
    const totalFrames = history.length > 0 ? history.length - 1 : 0;
    const maxTime = (totalFrames / TARGET_FPS).toFixed(2);
    const currentTime = (replayFrame / TARGET_FPS).toFixed(2);

    replayTimeRange.max = totalFrames;
    replayTimeRange.value = replayFrame;
    currentTimeDisplay.textContent = `${currentTime}s / ${maxTime}s`;
    
    if (isReplaying) {
        if (isPaused) {
            replayStatus.textContent = "⏸️ 一時停止中";
        } else if (replayFrame >= totalFrames) {
             replayStatus.textContent = "⏹️ 再生終了";
             isPaused = true;
        } else {
             replayStatus.textContent = `▶️ ${replaySpeedMultiplier.toFixed(2)}x 再生中`;
        }
        toggleReplayButton.textContent = isPaused ? "▶️ 再生" : "⏸️ 一時停止";
    }
}

/**
 * ゲーム終了メッセージの表示
 */
function displayEndMessage() {
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    
    const message = balls.length === 1 ?
        `${balls[0].color}の勝利！` :
        '引き分け！';

    ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
    ctx.shadowBlur = 10;
    ctx.lineWidth = 2; 
    
    ctx.fillText('ゲーム終了', WIDTH / 2, HEIGHT / 2 - 50);
    ctx.fillText(message, WIDTH / 2, HEIGHT / 2 + 20);

    ctx.shadowColor = 'transparent';
    ctx.shadowBlur = 0;
}

/**
 * 描画ループ
 */
function loop(timestamp) {
    if (!lastFrameTime) {
        lastFrameTime = timestamp;
    }
    const elapsed = timestamp - lastFrameTime;

    if (isReplaying) {
        // リプレイモード
        drawGameScene();
        
        if (!isPaused) {
            const targetFramesFloat = (elapsed / MS_PER_FRAME) * replaySpeedMultiplier;
            
            frameRemainder += targetFramesFloat;
            
            const frameAdvance = Math.floor(frameRemainder);
            
            frameRemainder -= frameAdvance;
            
            if (frameAdvance > 0) {
                replayFrame += frameAdvance;
                
                const totalFrames = history.length - 1;
                
                if (replayFrame >= totalFrames) {
                    replayFrame = totalFrames;
                    isPaused = true; 
                }
                
                restoreState(replayFrame);
            }
        } else {
            restoreState(replayFrame); 
        }

        updateReplayUI();
        
    } else {
        // プレイモード
        
        if (isGameFinished) {
            drawGameScene();
            displayEndMessage();
        } else {
            
            for (let s = 0; s < SUB_STEPS; s++) {
                
                // 1. 移動と境界衝突判定 
                balls.forEach(ball => {
                    if (ball.exists) {
                        ball.update();
                    }
                });

                // 2. 線の奪取判定
                for (let i = 0; i < balls.length; i++) {
                    for (let j = 0; j < balls.length; j++) {
                        if (i !== j) {
                            balls[i].checkStringCollision(balls[j]);
                        }
                    }
                }
                balls = balls.filter(ball => ball.exists);
            }
            
            drawGameScene();

            // 毎フレーム状態を記録
            recordState();
            frameCount++;

            // 終了判定
            if (balls.length <= 1) {
                isGameFinished = true;
                
                document.getElementById('replay-controls').style.display = 'block';
                replayTimeRange.disabled = false;
                replayFrame = frameCount; 
                isPaused = true;
                updateReplayUI();
            }
        }
    }

    lastFrameTime = timestamp;
    animationFrameId = requestAnimationFrame(loop);
}

// --- イベントリスナー ---

// 設定スライダー
speedRange.addEventListener('input', (e) => { 
    GAME_SPEED_MULTIPLIER = parseFloat(e.target.value); 
    speedValueSpan.textContent = GAME_SPEED_MULTIPLIER.toFixed(1); 
});
numBallsRange.addEventListener('input', (e) => { 
    NUM_BALLS = parseInt(e.target.value); 
    numBallsValueSpan.textContent = NUM_BALLS; 
});
numStringsRange.addEventListener('input', (e) => { 
    INITIAL_STRINGS_PER_BALL = parseInt(e.target.value); 
    numStringsValueSpan.textContent = INITIAL_STRINGS_PER_BALL; 
});

// スタート/リセット
restartButton.addEventListener('click', () => { 
    if (animationFrameId) { cancelAnimationFrame(animationFrameId); } 
    init(); 
    loop(performance.now()); 
});

// リプレイ速度
replaySpeedRange.addEventListener('input', (e) => {
    replaySpeedMultiplier = parseFloat(e.target.value);
    // 小数点第2位まで表示
    replaySpeedValueSpan.textContent = `${replaySpeedMultiplier.toFixed(2)}x`; 
    frameRemainder = 0;
    if(isReplaying) updateReplayUI();
});

// リプレイ操作
toggleReplayButton.addEventListener('click', () => {
    if (isGameFinished) {
        isReplaying = true;
        isPaused = !isPaused;
        if (replayFrame >= history.length - 1) {
            replayFrame = 0;
            restoreState(0); 
        }
        frameRemainder = 0;
        updateReplayUI();
    }
});

exitReplayButton.addEventListener('click', () => {
    isReplaying = false;
    isGameFinished = false;
    restoreState(history.length - 1);
    document.getElementById('replay-controls').style.display = 'none';
    isPaused = false;
});

// スライダーによる巻き戻し/早送り
replayTimeRange.addEventListener('input', (e) => {
    isReplaying = true;
    isPaused = true; 
    replayFrame = parseInt(e.target.value);
    restoreState(replayFrame);
    frameRemainder = 0;
    updateReplayUI();
});


// ゲーム開始
init();
loop(performance.now());
</script>
</body>
</html>
