<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>😋</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            height: 100%; 
            overflow: hidden; 
            font-family: sans-serif;
        }
        #main-container {
            display: flex;
            flex-direction: column; 
            height: 100vh; 
        }
        #physics-area {
            height: 55%; 
            width: 100%;
            background-color: #d0f0ff;
            overflow: hidden;
            position: relative;
        }
        #physics-area canvas {
            display: block;
        }
        #bomb-button {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 10;
            padding: 10px 15px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #dc3545;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px #a02c39;
            transition: all 0.1s;
            display: none; 
        }
        #bomb-button:active {
            box-shadow: 0 2px #a02c39;
            transform: translateY(2px);
        }
        /* #pause-buttonの個別スタイルを削除し、hidden-menu内のボタンに統一 */
        
        #hidden-menu {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
            display: none;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap; /* ボタンが改行されないように */
        }
        .auto-gen-button {
            padding: 5px 10px;
            margin: 5px;
            border: 1px solid #007bff;
            border-radius: 5px;
            background-color: #e9f7ff;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .auto-gen-button:hover {
            background-color: #cce5ff;
        }
        /* ポーズボタンにもauto-gen-buttonのスタイルを適用 */
        #pause-button-in-menu {
            padding: 5px 10px;
            margin: 5px;
            border: 1px solid #28a745; /* 緑色系 */
            border-radius: 5px;
            background-color: #e2f5e7;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        #pause-button-in-menu:hover {
            background-color: #c8e6c9;
        }


        #menu-area {
            height: 45%; 
            width: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            padding: 10px;
            position: relative; 
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 40px;
            max-width: 1000px;
            margin-top: -50px;
        }

        .menu-button {
            background: linear-gradient(to right, #a0e0ff, #c0f5ff);
            border: none;
            padding: 30px 50px;
            border-radius: 50px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            white-space: nowrap;
        }
        .menu-button:hover {
            background: linear-gradient(to right, #87d4f2, #b5ecff);
            transform: translateY(-7px) scale(1.05);
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.15)
        }
    </style>
</head>
<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <div id="main-container">
        <div id="physics-area">
            <button id="bomb-button" onclick="dropBomb()">💥 爆弾投下 (Cubes: 0)</button>
            
            <div id="hidden-menu">
                <p>自動生成間隔 (ms):</p>
                <button class="auto-gen-button" onclick="setAutoGenInterval(1)">1ms</button>
                <button class="auto-gen-button" onclick="setAutoGenInterval(10)">10ms</button>
                <button class="auto-gen-button" onclick="setAutoGenInterval(100)">100ms</button>
                <button class="auto-gen-button" onclick="setAutoGenInterval(1000)">1000ms</button>
                <button class="auto-gen-button" onclick="setAutoGenInterval(10000000)">落とさない</button>
                <hr style="margin: 5px 0; border: 0.5px solid #ccc;">
                <p>時間制御:</p>
                <button id="pause-button-in-menu" onclick="togglePause()">⏸️ 時間を止める/再開</button>
            </div>
        </div>

        <div id="menu-area">
            <div class="button-grid">
                <button class="menu-button" onclick="location.href='menu1.html'">見てるだけ</button>
                <button class="menu-button" onclick="location.href='menu2.html'">マルチオセロ</button>
                <button class="menu-button" onclick="location.href='menu3.html'">3D迷路</button>
                <button class="menu-button" onclick="location.href='menu4.html'">て</button>
                <button class="menu-button" onclick="location.href='menu5.html'">oて</button>
                <button class="menu-button" onclick="location.href='menu6.html'">ぼおる</button>
                <button class="menu-button" onclick="location.href='menu7.html'">オセロ</button>
                <button class="menu-button" onclick="location.href='menu8.html'">文字送り</button>
            </div>
        </div>
    </div>

    <script>
        const GROUND_SIZE = 10;
        const GROUND_HALF = GROUND_SIZE / 2;
        const GROUND_Y = 0; 
        const REMOVAL_THRESHOLD_Y = -10; 
        const MAX_CUBES = 100; 
        const BOMB_EXPLOSION_TIME = 3000;
        const container = document.getElementById('physics-area');
        const bombButton = document.getElementById('bomb-button');
        const hiddenMenu = document.getElementById('hidden-menu');
        const pauseButton = document.getElementById('pause-button-in-menu');

        let width = container.clientWidth;
        let height = container.clientHeight;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        renderer.setClearColor(0xd0f0ff); 
        renderer.shadowMap.enabled = true; 
        container.appendChild(renderer.domElement);
        
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const ambientLight = new THREE.AmbientLight(0x666666);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffffff);
        spotLight.position.set(10, 20, 10);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const world = new CANNON.World();
        world.gravity.set(0, -9.82, 0); 
        world.broadphase = new CANNON.NaiveBroadphase();
        world.solver.iterations = 10;

        const groundGeometry = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE);
        const groundMaterial = new THREE.MeshPhongMaterial({ color: 0xaaaaaa, side: THREE.DoubleSide });
        const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
        groundMesh.rotation.x = -Math.PI / 2;
        groundMesh.position.y = GROUND_Y;
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        const floorHeight = 0.1; 
        const floorShape = new CANNON.Box(new CANNON.Vec3(GROUND_HALF, floorHeight / 2, GROUND_HALF));
        const floorBody = new CANNON.Body({ mass: 0 }); 
        floorBody.addShape(floorShape);
        floorBody.position.set(0, GROUND_Y - floorHeight / 2, 0); 
        world.addBody(floorBody);

        const objects = [];

        function createBlock(startX = null, startY = null, startZ = null) {
            const size = Math.random() * 0.5 + 0.5; 
            const mass = 5;

            const randomRange = GROUND_HALF - 0.5; 
            const initialX = startX !== null ? startX : Math.random() * randomRange * 2 - randomRange;
            const initialY = startY !== null ? startY : 10 + Math.random() * 5;
            const initialZ = startZ !== null ? startZ : Math.random() * randomRange * 2 - randomRange;

            const boxGeometry = new THREE.BoxGeometry(size, size, size);
            const color = new THREE.Color(Math.random(), Math.random(), Math.random());
            const boxMaterial = new THREE.MeshPhongMaterial({ color: color });
            const boxMesh = new THREE.Mesh(boxGeometry, boxMaterial);
            boxMesh.castShadow = true;
            boxMesh.position.set(initialX, initialY, initialZ);
            scene.add(boxMesh);

            const boxShape = new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2));
            const boxBody = new CANNON.Body({ mass: mass });
            boxBody.addShape(boxShape);
            boxBody.position.copy(boxMesh.position);
            world.addBody(boxBody);

            objects.push({ mesh: boxMesh, body: boxBody });
        }

        let autoGenInterval = 300; 
        let autoGenTimer = setInterval(() => createBlock(), autoGenInterval);
        
        function setAutoGenInterval(ms) {
            if (autoGenTimer) {
                clearInterval(autoGenTimer);
            }
            autoGenInterval = ms;
            autoGenTimer = setInterval(() => createBlock(), autoGenInterval);
        }

        container.addEventListener('click', (event) => {
            if (event.target.id === 'bomb-button') {
                return;
            }
        });

        let bombBody = null;
        let bombMesh = null;
        let explosionMesh = null; 
        let bombTimer = null;

        const BOMB_RADIUS = 1.5;
        const BOMB_FORCE = 1500;
        const EXPLOSION_DURATION = 10; 
        
        window.dropBomb = function() {
            if (bombBody) return; 

            const sphereGeometry = new THREE.SphereGeometry(BOMB_RADIUS, 32, 32);
            const sphereMaterial = new THREE.MeshPhongMaterial({ color: 0xff0000, emissive: 0x550000 });
            bombMesh = new THREE.Mesh(sphereGeometry, sphereMaterial);
            bombMesh.castShadow = true;
            bombMesh.position.set(0, 20, 0); 
            scene.add(bombMesh);

            const sphereShape = new CANNON.Sphere(BOMB_RADIUS);
            const bodyMass = 100;
            bombBody = new CANNON.Body({ mass: bodyMass }); 
            bombBody.addShape(sphereShape);
            bombBody.position.copy(bombMesh.position);
            world.addBody(bombBody);

            bombTimer = setTimeout(() => {
                if (bombBody) {
                    triggerExplosion();
                }
            }, BOMB_EXPLOSION_TIME);

            bombButton.style.display = 'none';
        }

        function triggerExplosion() {
            if (!bombBody) return;

            const bombPosition = bombBody.position;
            
            clearTimeout(bombTimer);
            bombTimer = null;

            const explosionRadius = 5;
            const explosionGeometry = new THREE.SphereGeometry(explosionRadius, 16, 16);
            const explosionMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                transparent: true, 
                opacity: 0.8,
                blending: THREE.AdditiveBlending 
            });
            explosionMesh = new THREE.Mesh(explosionGeometry, explosionMaterial);
            explosionMesh.position.copy(bombPosition);
            scene.add(explosionMesh);
            
            for (const obj of objects) {
                const cubePosition = obj.body.position;
                
                const direction = new CANNON.Vec3();
                cubePosition.vsub(bombPosition, direction);
                
                const distance = direction.length();
                
                if (distance > 0) {
                    const strength = BOMB_FORCE / (distance * distance); 

                    direction.normalize();
                    direction.scale(strength, direction);

                    direction.y += BOMB_FORCE * 0.05; 
                    
                    obj.body.applyImpulse(direction, obj.body.position);
                }
            }

            world.removeBody(bombBody);
            scene.remove(bombMesh);
            bombBody = null;
            bombMesh = null;

            explosionMesh.frame = 0;
        }

        function updateExplosionEffect() {
            if (explosionMesh) {
                explosionMesh.frame++;
                const frame = explosionMesh.frame;
                
                if (frame > EXPLOSION_DURATION) {
                    scene.remove(explosionMesh);
                    explosionMesh = null;
                } else {
                    const progress = frame / EXPLOSION_DURATION;
                    explosionMesh.material.opacity = 0.8 * (1 - progress); 
                    explosionMesh.scale.setScalar(1 + progress * 2); 
                }
            }
        }

        let isPaused = false;
        let animationFrameId = null;

        window.togglePause = function() {
            isPaused = !isPaused;
            if (isPaused) {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                pauseButton.textContent = '▶️ 時間を再開 (Paused)';
            } else {
                pauseButton.textContent = '⏸️ 時間を止める/再開';
                animate();
            }
        }

        const timeStep = 1 / 60;

        function animate() {
            if (!isPaused) {
                animationFrameId = requestAnimationFrame(animate); 
            } else {
                return;
            }

            world.step(timeStep);

            const currentCubeCount = objects.length;
            bombButton.textContent = ` 爆弾投下 (Cubes: ${currentCubeCount})`;

            if (currentCubeCount >= MAX_CUBES && !bombBody) {
                bombButton.style.display = 'block';
            } else if (currentCubeCount < MAX_CUBES && !bombBody) {
                bombButton.style.display = 'none';
            }

            if (bombBody) {
                bombMesh.position.copy(bombBody.position);
                bombMesh.quaternion.copy(bombBody.quaternion);
            }

            updateExplosionEffect();

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);

                if (obj.body.position.y < REMOVAL_THRESHOLD_Y) {
                    scene.remove(obj.mesh);
                    world.removeBody(obj.body);
                    objects.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            width = container.clientWidth;
            height = container.clientHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        function getCornerArea(x, y, width, height) {
            const threshold = 0.2;
            const left = x < width * threshold;
            const right = x > width * (1 - threshold);
            const top = y < height * threshold;
            const bottom = y > height * (1 - threshold);

            if (right && top) return 'RT';
            if (left && bottom) return 'LB';
            if (right && bottom) return 'RB';

            return null;
        }

        const targetSequence = ['RT', 'LB', 'RT', 'RB'];
        let currentSequence = [];

        container.addEventListener('click', (event) => {
            const rect = container.getBoundingClientRect();
            const x = event.clientX - rect.left;
            const y = event.clientY - rect.top;

            if (event.target.id === 'bomb-button') {
                return;
            }
            
            const corner = getCornerArea(x, y, rect.width, rect.height);

            if (corner) {
                if (corner === targetSequence[currentSequence.length]) {
                    currentSequence.push(corner);
                } else {
                    currentSequence = [];
                    if (corner === 'RT') {
                        currentSequence.push(corner);
                    }
                }
                
                if (currentSequence.length === targetSequence.length) {
                    hiddenMenu.style.display = 'block';
                    currentSequence = [];
                }
            } else {
                currentSequence = [];
            }
        });

        window.setAutoGenInterval = setAutoGenInterval;

        animate();
    </script>

</body>
</html>
