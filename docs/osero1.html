<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボタン</title>
    <style>
        /* --- CSS部分 --- */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            transition: background-color 0.5s ease;
        }

        #funButton {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            outline: none;
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* 動きをスムーズにする */
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
            user-select: none; /* テキスト選択を無効化 */
        }

        /* 初期スタイル */
        .shape-circle {
            border-radius: 50%;
        }

        .shape-square {
            border-radius: 0;
        }

        .shape-rounded {
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <button id="funButton" class="shape-circle" style="background-color: #3498db;">
        更新なんてしてません
    </button>

    <script>
        // --- JavaScript部分 ---
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('funButton');
            const body = document.body;

            // ランダムな色の配列
            const colors = ['#e74c3c', '#2ecc71', '#f39c12', '#9b59b6', '#1abc9c', '#e67e22', '#3498db'];
            // ランダムな形のクラス名
            const shapes = ['shape-circle', 'shape-square', 'shape-rounded'];

            let colorIndex = 0;
            let shapeIndex = 0;

            button.addEventListener('click', () => {
                // 1. 色を変更
                colorIndex = (colorIndex + 1) % colors.length;
                const newColor = colors[colorIndex];
                button.style.backgroundColor = newColor;

                // 2. 形を変更
                // 現在のshapeクラスを削除
                shapes.forEach(shape => button.classList.remove(shape));

                shapeIndex = (shapeIndex + 1) % shapes.length;
                const newShape = shapes[shapeIndex];
                button.classList.add(newShape);
                
                // 3. ボタンのテキストも変更
                button.textContent = `ﾎﾟﾎﾟﾎﾟ${newShape.replace('shape-', '')}`;

                // 4. 背景色も連動して変更 (少し薄い色に)
                body.style.backgroundColor = newColor + '40'; // '40'で透過度を調整

                // 5. おまけ: ボタンを少し大きくして、すぐに戻すアニメーション
                button.style.transform = 'scale(1.1)';
                setTimeout(() => {
                    button.style.transform = 'scale(1.0)';
                }, 100);
            });
        });
    </script>
</body>
</html>
