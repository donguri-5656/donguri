
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Two Pane Layout Fixed</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        :root {
            --sidebar-width: 300px;
            --main-color: #4CAF50;
            --secondary-color: #66bb6a;
            --error-color: #f44336;
        }

        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f6;
            color: #333;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* 認証画面用コンテナ */
        #auth-container {
            max-width: 400px;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        /* メインチャットコンテナ（2ペイン） */
        #main-container {
            width: 100%;
            height: 100vh; 
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            border-radius: 0; 
            overflow: hidden;
            box-shadow: none; 
            background-color: #fff;
        }

        /* 💡 左側のルーム一覧ペイン */
        #left-pane {
            width: var(--sidebar-width);
            background-color: #fff;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
            
            /* 幅が縮まらないように固定 */
            flex-shrink: 0;
        }

        /* 💡 右側のチャット画面ペイン */
        #right-pane {
            flex-grow: 1;
            background-color: #f9f9f9;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        /* チャット画面のヘッダー */
        #chat-header {
            padding: 10px 20px;
            border-bottom: 1px solid #eee;
            background-color: #e8f5e9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; 
        }
        
        /* レスポンシブ対応 (モバイル表示時) */
        @media (max-width: 768px) {
            #main-container {
                 height: 100vh; 
                 border-radius: 0;
            }
            #left-pane {
                width: 100%;
                position: absolute; 
                z-index: 10;
                height: 100%;
                border-right: none;
            }
            #right-pane {
                width: 100%;
                position: absolute; 
                height: 100%;
            }
            #auth-container {
                margin: 20px;
            }
        }

        /* --- 共通部品 --- */
        input[type="text"], input[type="password"], input[type="email"], button {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        
        button {
            background-color: var(--main-color);
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #45a049;
        }
        
        /* ルーム一覧リスト */
        #room-list-view {
            overflow-y: auto;
            flex-grow: 1;
        }

        #public-rooms {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #public-rooms li {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            transition: background-color 0.1s;
            display: flex; 
            justify-content: space-between;
            align-items: center;
        }
        #public-rooms li:hover {
            background-color: #f0f0f0;
        }
        
        /* 現在滞在中の部屋のスタイル */
        #public-rooms li.current-room {
            background-color: #e0e0e0;
        }

        /* ルームリスト内のボタン */
        #public-rooms li button {
            width: auto;
            padding: 3px 8px;
            margin-left: 10px;
            background-color: var(--secondary-color);
            font-size: 0.8em;
            display: inline-block;
        }
        
        /* チャットウィンドウ */
        #chat-window {
            overflow-y: scroll;
            padding: 10px;
            flex-grow: 1;
            background-color: #fcfcfc;
        }
        
        #message-form {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: #fff;
            flex-shrink: 0; 
        }
        #message-input {
            margin-bottom: 0;
            flex-grow: 1;
            margin-right: 10px;
        }
        #message-form button {
            width: auto;
            min-width: 80px;
            margin-bottom: 0;
        }

        /* --- LINE風メッセージ表示 --- */
        #messages {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #messages li {
            margin-bottom: 15px;
            clear: both; 
            display: flow-root; 
        }
        .message-bubble {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 15px;
            word-wrap: break-word;
            position: relative;
        }
        .sender-name {
            font-size: 0.8em;
            color: #555;
            margin-bottom: 2px;
            font-weight: bold;
        }
        .message-text {
            font-size: 1em;
            margin: 0;
        }
        .message-timestamp {
            font-size: 0.7em;
            color: #999;
            position: absolute;
            bottom: 0;
            margin-left: 5px;
            white-space: nowrap;
        }
        .other-message .message-bubble {
            float: left;
            background-color: #e6e6e6; 
            border-bottom-left-radius: 2px;
        }
        .other-message .message-timestamp {
            left: 100%;
            margin-left: 5px;
            transform: translateY(-100%);
        }
        .my-message .message-bubble {
            float: right;
            background-color: #ccff90; 
            border-bottom-right-radius: 2px;
        }
        .my-message .message-timestamp {
            right: 100%;
            margin-right: 5px;
            transform: translateY(-100%);
        }
        .delete-button {
            float: right;
            padding: 0px 5px;
            margin-left: 5px;
            font-size: 0.7em;
            background-color: var(--error-color);
            width: auto;
            height: 20px;
            color: white;
            border: none;
            border-radius: 4px;
        }
        .system-message, .system-message-small {
            text-align: center;
            font-style: italic;
            color: #999;
            font-size: 0.8em;
            margin: 5px 0;
        }
    </style>
</head>
<body onload="checkLocalStorage()">
    
    <div id="auth-container">
        <h1 style="color: var(--main-color);">チャット ログイン</h1>
        <div id="auth-section">
            <p class="system-message">🔐 ユーザー名とパスワードでログイン/登録してください。</p>
            <input type="text" id="username-input" placeholder="ユーザー名 (必須)" maxlength="15" required>
            <input type="password" id="password-input" placeholder="パスワード (必須)" required>
            <button id="login-button" onclick="handleAuth('login')">ログイン</button>
            <button id="register-button" onclick="handleAuth('register')" style="background-color: #00bcd4;">新規登録</button>
        </div>
    </div>
    
    <div id="main-container" style="display: none;">
        
        <div id="left-pane">
            <div style="padding: 15px; border-bottom: 1px solid #ddd; background-color: #f7f7f7; flex-shrink: 0;">
                <h2 style="margin: 0; font-size: 1.2em; color: var(--main-color);">ようこそ、<span id="welcome-user"></span></h2>
                <button onclick="logout()" style="background-color: var(--error-color); margin-top: 10px;">ログアウト</button>
            </div>
            
            <div id="room-controls" style="padding: 10px; flex-shrink: 0;">
                <div style="display: flex; gap: 5px;">
                    <button style="width: 50%;" onclick="showRoomListView('joined')">参加中の部屋</button>
                    <button style="width: 50%; background-color: #00bcd4;" onclick="showRoomListView('new')">部屋を探す</button>
                </div>

                <button onclick="showCreateRoomView()" style="background-color: #f39c12; margin-top: 10px;">新しい部屋を作成</button>
                <div id="create-room-view" class="form-group" style="display:none; border-color: #00bcd4; margin-top: 10px;">
                    <h3>🆕 新しい部屋を作成</h3>
                    <input type="text" id="room-name-input" placeholder="チャットルーム名" maxlength="20">
                    
                    <p style="margin: 5px 0 5px;">アクセス設定:</p>
                    <div class="radio-group" style="display: flex; justify-content: space-around;">
                        <label>
                            <input type="radio" name="access-type" value="public" checked onchange="togglePrivatePassword(false)"> 公開
                        </label>
                        <label>
                            <input type="radio" name="access-type" value="private" onchange="togglePrivatePassword(true)"> 非公開
                        </label>
                    </div>
                    <input type="password" id="private-room-password" placeholder="非公開ルーム用パスワード" style="display:none;">
                    <button onclick="createRoom()">作成・入室</button>
                </div>
            </div>

            <div id="room-list-view">
                <div id="public-room-list">
                    <h4 id="room-list-title" style="padding: 0 15px; margin: 10px 0;">参加中のルーム一覧</h4>
                    <ul id="public-rooms">
                        <li class="system-message">ルームを読み込み中...</li>
                    </ul>
                </div>
            </div>
            
        </div>
        
        <div id="right-pane" style="display: none;">
            <div id="chat-header">
                <h2 id="current-room-name" style="margin: 0; font-size: 1.1em;">ルームを選択してください</h2>
                <div style="display: flex; gap: 10px;">
                    <button id="back-to-list-button" onclick="showRoomList()" style="width: auto; padding: 5px 10px; background-color: #5cb85c; display: none;">&#x25C0; 戻る</button> 
                    <button onclick="leaveRoom(true)" style="width: auto; padding: 5px 10px; background-color: var(--error-color);">退出</button>
                </div>
            </div>
            
            <div id="chat-window">
                <ul id="messages">
                    <li class="system-message">左側のリストからチャットルームを選択してください。</li>
                </ul>
            </div>
            
            <form id="message-form">
                <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
                <button type="submit">送信</button>
            </form>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            // ... (Firebaseの設定情報は省略)
            apiKey: "AIzaSyDj6brEQowFaATPL7sPIKFFsB1-ZeZNrsk",
            authDomain: "donguri-st2.firebaseapp.com",
            databaseURL: "https://donguri-st2-default-rtdb.firebaseio.com",
            projectId: "donguri-st2",
            storageBucket: "donguri-st2.firebasestorage.app",
            messagingSenderId: "926527636216",
            appId: "1:926527636216:web:1820ab7c9d8750076ab10d",
            measurementId: "G-C7ZB3FWKS5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const roomsRef = database.ref('chat-rooms');
        const usersRef = database.ref('users'); 
        
        let currentUserName = '';
        let currentRoom = null; 
        let messagesRef = null;
        let isPrivateRoom = false; 

        const authContainer = document.getElementById('auth-container');
        const mainContainer = document.getElementById('main-container');
        const leftPane = document.getElementById('left-pane');
        const rightPane = document.getElementById('right-pane');
        const welcomeUser = document.getElementById('welcome-user');
        const currentRoomName = document.getElementById('current-room-name');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const roomNameInput = document.getElementById('room-name-input');
        const privatePasswordInput = document.getElementById('private-room-password');
        const createRoomView = document.getElementById('create-room-view');
        const roomListView = document.getElementById('room-list-view');
        const roomListTitle = document.getElementById('room-list-title');
        const publicRoomsList = document.getElementById('public-rooms');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const messagesList = document.getElementById('messages');
        const chatWindow = document.getElementById('chat-window');
        const backToListButton = document.getElementById('back-to-list-button');


        // --- 認証・セッション管理 ---
        
        function isMobile() {
            return window.innerWidth <= 768;
        }

        function checkLocalStorage() {
            const storedUser = localStorage.getItem('chatUser');
            if (storedUser) {
                currentUserName = storedUser;
                showMainLayout(currentUserName);
            } else {
                authContainer.style.display = 'block';
                mainContainer.style.display = 'none';
            }
        }
        
        function handleAuth(type) {
            const user = usernameInput.value.trim();
            const pass = passwordInput.value;
            if (!user || !pass) return alert('ユーザー名とパスワードを入力してください。');
            
            usersRef.child(user).once('value', (snapshot) => {
                const userData = snapshot.val();
                
                if (type === 'register') {
                    if (userData) {
                        alert('そのユーザー名はすでに登録されています。');
                    } else {
                        usersRef.child(user).set({ password: pass })
                            .then(() => {
                                currentUserName = user;
                                localStorage.setItem('chatUser', user);
                                showMainLayout(user);
                            });
                    }
                } else { // login
                    if (userData && userData.password === pass) {
                        currentUserName = user;
                        localStorage.setItem('chatUser', user);
                        showMainLayout(user);
                    } else {
                        alert('ユーザー名またはパスワードが違います。');
                    }
                }
            });
        }
        
        function showMainLayout(user) {
            authContainer.style.display = 'none';
            mainContainer.style.display = 'flex';
            welcomeUser.textContent = user;
            
            if (isMobile()) {
                leftPane.style.display = 'flex';
                rightPane.style.display = 'none'; 
                backToListButton.style.display = 'none';
            } else {
                leftPane.style.display = 'flex';
                rightPane.style.display = 'flex';
                backToListButton.style.display = 'none';
            }
            
            showRoomListView('joined', true); // ログイン時は自動入室を試みる
        }

        function logout() {
            if (currentRoom) {
                // ログアウト時は、現在の部屋から退出し、通知を出す
                // ログアウト時はメンバーリストからは削除しない（前回修正点を維持）
                database.ref('chat-rooms/' + currentRoom + '/messages').push({
                     user: 'System',
                     text: `${currentUserName} が退出しました。（ログアウト）`,
                     timestamp: Date.now()
                });
            }
            localStorage.removeItem('chatUser');
            currentUserName = '';
            currentRoom = null;
            
            mainContainer.style.display = 'none';
            authContainer.style.display = 'block';
            usernameInput.value = '';
            passwordInput.value = '';
            roomsRef.off('value'); 
            alert('ログアウトしました。');
        }

        function togglePrivatePassword(show) {
            privatePasswordInput.style.display = show ? 'block' : 'none';
        }

        // --- ルームリスト・ルーム操作 ---

        function showCreateRoomView() {
            createRoomView.style.display = 'block';
            roomListView.style.display = 'none';
        }

        /**
         * @param {string} type - 'joined' または 'new'
         * @param {boolean} tryAutoJoin - ログイン時など、メンバーになっている部屋に自動で入室を試みるか
         */
        function showRoomListView(type, tryAutoJoin = false) {
            // 部屋リストに戻るときは作成ビューを非表示にする
            createRoomView.style.display = 'none'; 
            roomListView.style.display = 'block';
            
            if (type === 'joined') {
                roomListTitle.textContent = '🏠 参加中のルーム';
            } else {
                roomListTitle.textContent = '🔍 部屋を探す (新規参加)';
            }
            
            startRoomListListener(type, tryAutoJoin);
        }

        function startRoomListListener(type, tryAutoJoin) {
            roomsRef.off('value');
            roomsRef.on('value', (snapshot) => {
                const roomsData = snapshot.val();
                updateRoomList(roomsData, type, tryAutoJoin);
            });
        }
        
        function updateRoomList(roomsData, type, tryAutoJoin) {
            publicRoomsList.innerHTML = ''; 
            let roomFound = false;
            let joinedRooms = [];
            let lastJoinedRoomName = null;
            let latestJoinTime = 0;

            if (roomsData) {
                Object.keys(roomsData).forEach(roomName => {
                    const roomInfo = roomsData[roomName];
                    const isPrivate = roomInfo.access === 'private';
                    // 参加判定を /members リストの有無に統一
                    const isMember = roomInfo.members && roomInfo.members[currentUserName]; 
                    
                    let shouldDisplay = false;
                    
                    if (type === 'joined') {
                        if (isMember) {
                            shouldDisplay = true;
                            joinedRooms.push(roomName);
                            // メンバーになった時間の追跡（簡易的に部屋の作成時間で代用）
                            if (roomInfo.createdAt > latestJoinTime) {
                                latestJoinTime = roomInfo.createdAt;
                                lastJoinedRoomName = roomName;
                            }
                        }
                    } else { // type === 'new' (部屋を探す)
                        // 新規のルーム: /members にユーザー名がない部屋
                        if (!isMember) {
                             shouldDisplay = true;
                        }
                    }

                    if (shouldDisplay) {
                        roomFound = true;
                        const lockIcon = isPrivate ? '🔒' : '💡';
                        
                        // 現在開いている部屋のみ「滞在」表示
                        const isCurrentlyJoined = currentRoom === roomName; 
                        const status = isCurrentlyJoined ? ' (滞在中)' : '';
                        
                        // 参加中ではない、かつ非公開の部屋を探している場合のみパスワードが必要
                        const needsPassword = isPrivate && type === 'new';

                        const li = document.createElement('li');
                        li.className = isCurrentlyJoined ? 'current-room' : '';
                        
                        const buttonText = isCurrentlyJoined ? '滞在' : (needsPassword ? 'パスワードで参加' : '入室');
                        const buttonDisabled = isCurrentlyJoined;

                        li.innerHTML = `
                            <div>
                                ${lockIcon} <strong>${roomName}</strong> 
                                <span style="font-size: 0.8em; color: ${isCurrentlyJoined ? 'blue' : '#555'};">${status}</span>
                            </div>
                            <button onclick="joinRoomByName('${roomName}', ${isPrivate}, ${isMember})" ${buttonDisabled ? 'disabled' : ''}>
                                ${buttonText}
                            </button>
                        `;

                        li.addEventListener('click', () => {
                            if (!buttonDisabled) {
                                joinRoomByName(roomName, isPrivate, isMember);
                            }
                        });

                        publicRoomsList.appendChild(li);
                    }
                });
            }

            if (!roomFound) {
                const li = document.createElement('li');
                li.className = 'system-message';
                li.textContent = (type === 'joined') ? '参加中のルームはありません。' : '新規参加可能なルームはありません。';
                publicRoomsList.appendChild(li);
            }
            
            // 自動入室ロジック
            if (tryAutoJoin && lastJoinedRoomName && !currentRoom) {
                // メンバーになっている部屋があり、かつ現在どの部屋にも入っていない場合
                const roomInfo = roomsData[lastJoinedRoomName];
                startChat(lastJoinedRoomName, roomInfo.access === 'private', false, false); // isNewRoom=false, isNewJoin=false (自動入室のため通知なし)
            }
        }

        function createRoom() {
            if (!currentUserName) return alert('先にログインしてください。');

            const roomName = roomNameInput.value.trim();
            if (!roomName) return alert('チャットルーム名を入力してください。');
            
            const accessType = document.querySelector('input[name="access-type"]:checked').value;
            const password = (accessType === 'private') ? privatePasswordInput.value.trim() : null;
            
            if (accessType === 'private' && !password) return alert('非公開ルームを作成するにはパスワードが必要です。');

            roomsRef.child(roomName).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    alert('その名前のルームはすでに存在します。');
                    return;
                }
                
                const newRoomInfo = {
                    access: accessType,
                    createdAt: Date.now(),
                    creator: currentUserName,
                    password: password,
                    // 公開・非公開問わず、作成者名をメンバーに設定
                    members: { [currentUserName]: true }
                };
                
                roomsRef.child(roomName).set(newRoomInfo)
                    .then(() => {
                        startChat(roomName, accessType === 'private', true); // isNewRoom=true
                    });
            });
        }

        function joinRoomByName(roomName, isPrivateRoomFromList, isMember) {
            if (!currentUserName) return alert('先にログインしてください。');
            if (currentRoom === roomName) return; 

            roomsRef.child(roomName).once('value', (snapshot) => {
                const roomInfo = snapshot.val();
                if (!roomInfo) return alert('そのルームは存在しません。');
                
                const isPrivate = roomInfo.access === 'private';
                
                // すでにメンバーである場合は、通知なしで入室
                if (isMember) {
                    startChat(roomName, isPrivate, false); // isNewRoom=false
                    return;
                }
                
                // メンバーではない場合（新規参加）
                if (isPrivate) {
                    let enteredPassword = prompt(`🔒 非公開ルーム「${roomName}」に参加するにはパスワードを入力してください:`);
                    if (enteredPassword === null) return; 
                    
                    if (enteredPassword === roomInfo.password) {
                        roomsRef.child(roomName + '/members/' + currentUserName).set(true)
                            .then(() => {
                                startChat(roomName, true, false, true); // isNewRoom=false, isNewJoin=true (新規参加通知を出す)
                            });
                    } else {
                        alert('パスワードが違います。');
                        return;
                    }
                } else {
                    // 公開部屋への新規参加
                    roomsRef.child(roomName + '/members/' + currentUserName).set(true)
                        .then(() => {
                            startChat(roomName, false, false, true); // isNewRoom=false, isNewJoin=true
                        });
                }
            });
        }
        
        // --- チャットビューの制御 ---
        
        /**
         * @param {string} roomName - 入室する部屋の名前
         * @param {boolean} privateRoom - 非公開部屋か
         * @param {boolean} isNewRoom - 新規作成された部屋か
         * @param {boolean} isNewJoin - 既存の部屋に初めてメンバーとして参加したか
         */
        function startChat(roomName, privateRoom, isNewRoom, isNewJoin = false) {
            if (currentRoom) {
                // 部屋移動時は退出通知もメンバーからの削除も行わない
                leaveRoom(false); 
            }
            
            roomsRef.off('value'); 

            currentRoom = roomName;
            isPrivateRoom = privateRoom;
            currentRoomName.textContent = `${currentRoom} (${isPrivateRoom ? '🔒 非公開' : '💡 公開'})`;
            
            messagesList.innerHTML = '';
            messagesRef = database.ref('chat-rooms/' + currentRoom + '/messages');

            // 画面切り替えロジック
            if (isMobile()) {
                leftPane.style.display = 'none';
                rightPane.style.display = 'flex';
                backToListButton.style.display = 'block';
            } else {
                leftPane.style.display = 'flex';
                rightPane.style.display = 'flex';
                backToListButton.style.display = 'none'; 
            }

            // リストの滞在表示を更新
            showRoomListView('joined');

            // メッセージのリスナー設定
            messagesRef.on('child_added', (snapshot) => {
                const message = snapshot.val();
                const messageId = snapshot.key;
                displayMessage(message.user, message.text, message.timestamp, messageId);
            });
            
            // 新規作成時 or 新規メンバー参加時 のみ通知を出す
            if (isNewRoom || isNewJoin) {
                messagesRef.once('value', () => { 
                    const joinText = isNewRoom ? 
                        `${currentUserName} がルームを作成し、入室しました。` :
                        `${currentUserName} が入室しました。`;
                    sendSystemMessage(joinText);
                });
            }
        }

        /**
         * @param {boolean} isManualLeave - 退出ボタンを押したか (true: 完全に部屋から抜ける)
         */
        function leaveRoom(isManualLeave) {
            const roomToLeave = currentRoom;
            
            if (!roomToLeave) return; 

            if (messagesRef) {
                messagesRef.off();
            }

            if (isManualLeave) {
                // 手動退出 (isManualLeave=true) の時のみ退出通知を出し、メンバーリストから削除
                
                // 1. 退出通知を投稿
                 database.ref('chat-rooms/' + roomToLeave + '/messages').push({
                     user: 'System',
                     text: `${currentUserName} が退出しました。`,
                     timestamp: Date.now()
                 });

                // 2. データベースからメンバーリストを削除する
                const removePromise = database.ref('chat-rooms/' + roomToLeave + '/members/' + currentUserName).remove();

                removePromise.then(() => {
                    currentRoom = null;
                    alert('部屋から退出しました。');
                    showRoomList(); // データベース更新後に画面更新を呼ぶ
                }).catch(error => {
                    console.error("退出処理中のメンバー削除エラー:", error);
                    alert('退出処理中にエラーが発生しました。エラーが発生しましたが、画面を更新します。');
                    currentRoom = null;
                    showRoomList(); 
                });
            } else {
                // 部屋移動時など: 通知も削除も行わず、currentRoomをリセット
                currentRoom = null;
            }
            
            messagesRef = null;
            isPrivateRoom = false;
            messagesList.innerHTML = '';
        }
        
        // ルーム一覧へ戻るボタン用
        function showRoomList() {
            
            leftPane.style.display = 'flex';
            rightPane.style.display = 'flex'; 
            backToListButton.style.display = 'none';
            
            currentRoomName.textContent = 'ルームを選択してください';
            messagesList.innerHTML = '<li class="system-message">左側のリストからチャットルームを選択してください。</li>';

            showRoomListView('joined'); 
        }

        // --- メッセージ操作 ---
        
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            
            if (messageText && currentRoom) {
                sendMessage(currentUserName, messageText);
                messageInput.value = ''; 
            }
        });

        function sendMessage(user, text) {
            if (!messagesRef) return;

            const newMessage = {
                user: user,
                text: text,
                timestamp: Date.now()
            };

            messagesRef.push(newMessage)
                .catch(error => console.error("メッセージ送信エラー:", error));
        }
        
        function sendSystemMessage(text) {
            if (!messagesRef) return;

            const newMessage = {
                user: 'System',
                text: text,
                timestamp: Date.now()
            };

            messagesRef.push(newMessage);
        }

        function displayMessage(user, text, timestamp, messageId) {
            const li = document.createElement('li');
            const date = new Date(timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            if (user === 'System') {
                li.className = 'system-message-small';
                li.textContent = text;
            } else {
                const isMyMessage = user === currentUserName;
                li.className = isMyMessage ? 'my-message' : 'other-message';
                
                let deleteButton = '';
                if (isMyMessage) {
                    deleteButton = `<button class="delete-button" onclick="deleteMessage('${messageId}')">削除</button>`;
                }

                li.innerHTML = `
                    ${isMyMessage ? deleteButton : `<div class="sender-name">${user}</div>`}
                    <div class="message-bubble">
                        <p class="message-text">${text}</p>
                        <span class="message-timestamp">${date}</span>
                    </div>
                `;
            }

            messagesList.appendChild(li);
            
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function deleteMessage(messageId) {
            if (confirm('本当にこのメッセージを削除しますか？')) {
                messagesRef.child(messageId).remove()
                    .catch(error => alert("メッセージの削除に失敗しました。"));
            }
        }
    </script>
</body>
</html>
