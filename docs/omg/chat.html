<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }

        input[type="text"], button {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }

        button:hover:not(:disabled) {
            background-color: #45a049;
        }
        
        .form-group {
            margin-bottom: 10px;
            padding: 10px;
            border: 1px dashed #ddd;
            border-radius: 4px;
        }
        
        .radio-group label {
            margin-right: 20px;
        }

        #public-room-list {
            margin-top: 20px;
            border: 1px solid #4CAF50;
            padding: 10px;
            border-radius: 4px;
            background-color: #e8f5e9;
        }

        #public-rooms {
            list-style: none;
            padding: 0;
        }

        #public-rooms li {
            padding: 8px;
            margin-bottom: 5px;
            border-bottom: 1px dotted #a5d6a7;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #public-rooms li button {
            width: auto;
            padding: 5px 10px;
            margin-bottom: 0;
            background-color: #66bb6a;
            font-size: 0.9em;
        }

        #chat-window {
            height: 300px;
            border: 1px solid #ddd;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        #messages {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #messages li {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            background-color: #e0f7fa;
            word-wrap: break-word;
        }

        .system-message {
            text-align: center;
            font-style: italic;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>チャット</h1>

        <div id="setup-view">
            <p class="system-message">✅ 最初にユーザー名を入力・決定してください。</p>
            <input type="text" id="username-input" placeholder="ユーザー名" maxlength="15">
            <button id="set-name-button" onclick="setName()">ユーザー名を決定</button>
            <hr>
            
            <div id="room-controls" style="opacity: 0.5; pointer-events: none;">
                <p class="system-message">部屋名を入力して、作成または参加してください。</p>
                <input type="text" id="room-name-input" placeholder="チャットルーム名 (例: general)" maxlength="20">
                
                <div class="form-group">
                    <p>アクセス設定:</p>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="access-type" value="public" checked> 💡 公開 (自由参加)
                        </label>
                        <label>
                            <input type="radio" name="access-type" value="private"> 🔒 非公開 (招待専用)
                        </label>
                    </div>
                    <button onclick="createRoom()">部屋を作成</button>
                </div>
                
                <p class="system-message">または、**入力した名前の公開ルーム**に参加</p>
                <button onclick="joinRoomByInput()">入力名で参加</button>
                
                <hr>
                
                <div id="public-room-list">
                    <h3>💡 公開ルーム一覧</h3>
                    <ul id="public-rooms">
                        <li class="system-message">公開ルームを読み込み中...</li>
                    </ul>
                </div>
            </div>
        </div>

        <div id="chat-view" style="display: none;">
            <h2 id="current-room-name"></h2>
            <div id="chat-window">
                <ul id="messages">
                </ul>
            </div>
            <form id="message-form">
                <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
                <button type="submit">送信</button>
            </form>
            <button onclick="leaveRoom()">部屋から退出</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDj6brEQowFaATPL7sPIKFFsB1-ZeZNrsk",
            authDomain: "donguri-st2.firebaseapp.com",
            databaseURL: "https://donguri-st2-default-rtdb.firebaseio.com",
            projectId: "donguri-st2",
            storageBucket: "donguri-st2.firebasestorage.app",
            messagingSenderId: "926527636216",
            appId: "1:926527636216:web:1820ab7c9d8750076ab10d",
            measurementId: "G-C7ZB3FWKS5"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const roomsRef = database.ref('chat-rooms'); 
        
        let userName = '';
        let currentRoom = null;
        let messagesRef = null; 

        const setupView = document.getElementById('setup-view');
        const chatView = document.getElementById('chat-view');
        const messageForm = document.getElementById('message-form');
        const messagesList = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const currentRoomName = document.getElementById('current-room-name');
        const usernameInput = document.getElementById('username-input');
        const roomControls = document.getElementById('room-controls');
        const setNameButton = document.getElementById('set-name-button');
        const roomNameInput = document.getElementById('room-name-input');
        const publicRoomsList = document.getElementById('public-rooms'); 

        function startRoomListListener() {
            roomsRef.on('value', (snapshot) => {
                const roomsData = snapshot.val();
                updatePublicRoomList(roomsData);
            });
        }
        
        function updatePublicRoomList(roomsData) {
            publicRoomsList.innerHTML = ''; 
            let publicRoomFound = false;

            if (roomsData) {
                Object.keys(roomsData).forEach(roomName => {
                    const roomInfo = roomsData[roomName];
                    
                    if (roomInfo.access === 'public') {
                        publicRoomFound = true;
                        
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <span>${roomName} (作成者: ${roomInfo.creator})</span>
                            <button onclick="joinRoomByName('${roomName}')">参加</button>
                        `;
                        publicRoomsList.appendChild(li);
                    }
                });
            }

            if (!publicRoomFound) {
                const li = document.createElement('li');
                li.className = 'system-message';
                li.textContent = '現在、公開されているルームはありません。';
                publicRoomsList.appendChild(li);
            }
        }

        function setName() {
            const name = usernameInput.value.trim();
            if (name) {
                userName = name;
                usernameInput.disabled = true;
                setNameButton.disabled = true;
                setNameButton.textContent = 'ユーザー名設定済み';
                
                roomControls.style.opacity = '1.0';
                roomControls.style.pointerEvents = 'auto';
                startRoomListListener();
                alert(`ユーザー名: ${userName} で設定されました。`);
            } else {
                alert('ユーザー名を入力してください。');
            }
        }

        function createRoom() {
            if (!userName) return alert('先にユーザー名を決定してください。');

            const roomName = roomNameInput.value.trim();
            if (!roomName) return alert('チャットルーム名を入力してください。');
            
            const accessType = document.querySelector('input[name="access-type"]:checked').value;
            
            roomsRef.child(roomName).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    alert('その名前のルームはすでに存在します。手動入力欄を使う場合は「入力名で参加」を押すか、一覧から参加してください。');
                    return;
                }
                
                const newRoomInfo = {
                    access: accessType,
                    createdAt: Date.now(),
                    creator: userName
                };
                
                roomsRef.child(roomName).set(newRoomInfo)
                    .then(() => {
                        console.log(`ルーム ${roomName} (${accessType}) を作成しました。`);
                        startChat(roomName, true);
                    })
                    .catch(error => {
                        console.error("ルーム作成エラー:", error);
                        alert("ルームの作成に失敗しました。");
                    });
            });
        }

        function joinRoomByInput() {
            const roomName = roomNameInput.value.trim();
            if (!roomName) return alert('参加したいチャットルーム名を入力してください。');
            joinRoomByName(roomName);
        }

        function joinRoomByName(roomName) {
            if (!userName) return alert('先にユーザー名を決定してください。');
            if (!roomName) return;
            
            roomsRef.child(roomName).once('value', (snapshot) => {
                if (!snapshot.exists()) {
                    alert('そのルームは存在しません。');
                    return;
                }
                
                const roomInfo = snapshot.val();
                
                if (roomInfo.access === 'public') {
                    startChat(roomName, false);
                } else {
                    alert(`ルーム「${roomName}」は非公開のため参加できません。`);
                }
            });
        }
        
        function startChat(roomName, isNewRoom) {
            if (messagesRef) {
                messagesRef.off();
                messagesList.innerHTML = '';
            }
            
            roomsRef.off('value'); 

            currentRoom = roomName;
            currentRoomName.textContent = `ルーム: ${currentRoom}`;
            
            messagesRef = database.ref('chat-rooms/' + currentRoom + '/messages');

            setupView.style.display = 'none';
            chatView.style.display = 'block';

            messagesRef.on('child_added', (snapshot) => {
                const message = snapshot.val();
                displayMessage(message.user, message.text, message.timestamp);
            });
            
            const joinText = isNewRoom ? 
                `${userName} がルームを作成し、入室しました。` :
                `${userName} が入室しました。`;
                
            sendMessage(null, joinText); 
        }

        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            
            if (messageText && currentRoom) {
                sendMessage(userName, messageText);
                messageInput.value = ''; 
            }
        });

        function sendMessage(user, text) {
            if (!messagesRef) return;

            const newMessage = {
                user: user || 'System',
                text: text,
                timestamp: Date.now()
            };

            messagesRef.push(newMessage)
                .catch(error => {
                    console.error("メッセージ送信エラー:", error);
                    alert("メッセージの送信に失敗しました。");
                });
        }

        function displayMessage(user, text, timestamp) {
            const li = document.createElement('li');
            const date = new Date(timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            if (user === 'System') {
                li.className = 'system-message';
                li.textContent = text;
            } else {
                li.innerHTML = `<strong>${user}</strong> (${date}): ${text}`;
                if (user === userName) {
                    li.style.backgroundColor = '#ccff90'; 
                }
            }

            messagesList.appendChild(li);
            
            const chatWindow = document.getElementById('chat-window');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function leaveRoom() {
            if (messagesRef) {
                sendMessage(null, `${userName} が退出しました。`);
                messagesRef.off();
            }

            currentRoom = null;
            messagesRef = null;
            messagesList.innerHTML = '';
            
            chatView.style.display = 'none';
            setupView.style.display = 'block';
            
            alert('部屋から退出しました。');
            
            if (userName) {
                 startRoomListListener();
            } else {
                usernameInput.disabled = false;
                usernameInput.value = '';
                setNameButton.disabled = false;
                setNameButton.textContent = 'ユーザー名を決定';
                roomControls.style.opacity = '0.5';
                roomControls.style.pointerEvents = 'none';
            }
        }

    </script>
</body>
</html>
