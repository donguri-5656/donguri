<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <style>
        /* --- CSS スタイル --- */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #4CAF50;
            text-align: center;
            margin-bottom: 20px;
        }

        /* フォームのスタイル */
        input[type="text"], button {
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #45a049;
        }

        /* チャット表示エリア */
        #chat-window {
            height: 300px;
            border: 1px solid #ddd;
            overflow-y: scroll;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            background-color: #f9f9f9;
        }

        #messages {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        #messages li {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 4px;
            background-color: #e0f7fa;
            word-wrap: break-word;
        }

        .system-message {
            text-align: center;
            font-style: italic;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>チャット</h1>

        <div id="setup-view">
            <p class="system-message">最初にユーザー名を入力してください。</p>
            <input type="text" id="username-input" placeholder="ユーザー名" maxlength="15">
            <button onclick="setName()">ユーザー名を決定</button>
            <hr>
            <p class="system-message">チャットルーム名を入力して、作成または参加してください。</p>
            <input type="text" id="room-name-input" placeholder="チャットルーム名 (例: general)" maxlength="20">
            <button onclick="joinRoom()">部屋に参加/作成</button>
        </div>

        <div id="chat-view" style="display: none;">
            <h2 id="current-room-name"></h2>
            <div id="chat-window">
                <ul id="messages">
                    </ul>
            </div>
            <form id="message-form">
                <input type="text" id="message-input" placeholder="メッセージを入力..." autocomplete="off">
                <button type="submit">送信</button>
            </form>
            <button onclick="leaveRoom()">部屋から退出</button>
        </div>
    </div>

    <script>
const firebaseConfig = {
            apiKey: "AIzaSyDj6brEQowFaATPL7sPIKFFsB1-ZeZNrsk",
            authDomain: "donguri-st2.firebaseapp.com",
            databaseURL: "https://donguri-st2-default-rtdb.firebaseio.com",
            projectId: "donguri-st2",
            storageBucket: "donguri-st2.firebasestorage.app",
            messagingSenderId: "926527636216",
            appId: "1:926527636216:web:1820ab7c9d8750076ab10d",
            measurementId: "G-C7ZB3FWKS5"
        };

        // Firebaseの初期化
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        
        let userName = '';
        let currentRoom = null;
        let messagesRef = null; // 現在のチャットルームのデータベース参照

        const setupView = document.getElementById('setup-view');
        const chatView = document.getElementById('chat-view');
        const messageForm = document.getElementById('message-form');
        const messagesList = document.getElementById('messages');
        const messageInput = document.getElementById('message-input');
        const currentRoomName = document.getElementById('current-room-name');
        const usernameInput = document.getElementById('username-input');

        /**
         * ユーザー名を決定し、入力欄を無効化する
         */
        function setName() {
            const name = usernameInput.value.trim();
            if (name) {
                userName = name;
                usernameInput.disabled = true;
                alert(`ユーザー名: ${userName} で設定されました。`);
                // 決定ボタンのテキストを変更したり、スタイルを変更しても良い
            } else {
                alert('ユーザー名を入力してください。');
            }
        }

        /**
         * 部屋に参加または作成する
         */
        function joinRoom() {
            if (!userName) {
                alert('先にユーザー名を決定してください。');
                return;
            }

            const roomName = document.getElementById('room-name-input').value.trim();
            if (!roomName) {
                alert('チャットルーム名を入力してください。');
                return;
            }

            // 以前のリスナーを解除 (もしあれば)
            if (messagesRef) {
                messagesRef.off();
                messagesList.innerHTML = '';
            }

            currentRoom = roomName;
            currentRoomName.textContent = `ルーム: ${currentRoom}`;
            
            // Firebaseの特定のパスを参照 ('chat-rooms' -> ルーム名 -> 'messages')
            messagesRef = database.ref('chat-rooms/' + currentRoom + '/messages');

            // UIの切り替え
            setupView.style.display = 'none';
            chatView.style.display = 'block';

            // 既存/新規メッセージのリスナーを設定
            // 'child_added' は、既存の全ての子と、その後に追加される新しい子に対して呼び出されます
            messagesRef.on('child_added', (snapshot) => {
                const message = snapshot.val();
                displayMessage(message.user, message.text, message.timestamp);
            });
            
            // 参加メッセージを送信 (オプション)
            sendMessage(null, `${userName} が入室しました。`); 
        }

        /**
         * メッセージ送信フォームの処理
         */
        messageForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const messageText = messageInput.value.trim();
            
            if (messageText && currentRoom) {
                sendMessage(userName, messageText);
                messageInput.value = ''; // 入力欄をクリア
            }
        });

        /**
         * Firebase Realtime Databaseにメッセージを保存する
         * @param {string | null} user - ユーザー名 (システムメッセージの場合は null)
         * @param {string} text - メッセージ内容
         */
        function sendMessage(user, text) {
            if (!messagesRef) return;

            const newMessage = {
                user: user || 'System', // ユーザー名、または 'System'
                text: text,
                timestamp: Date.now()
            };

            // データベースに新しいメッセージをプッシュ
            messagesRef.push(newMessage)
                .catch(error => {
                    console.error("メッセージ送信エラー:", error);
                    alert("メッセージの送信に失敗しました。");
                });
        }


        /**
         * メッセージをUIに表示する
         * @param {string} user - ユーザー名
         * @param {string} text - メッセージ内容
         * @param {number} timestamp - タイムスタンプ
         */
        function displayMessage(user, text, timestamp) {
            const li = document.createElement('li');
            const date = new Date(timestamp).toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });

            if (user === 'System') {
                li.className = 'system-message';
                li.textContent = text;
            } else {
                li.innerHTML = `<strong>${user}</strong> (${date}): ${text}`;
                // 自分のメッセージならスタイルを変えるなどしても良い
                if (user === userName) {
                    li.style.backgroundColor = '#ccff90'; 
                }
            }

            messagesList.appendChild(li);
            
            // 最新のメッセージが見えるようにスクロール
            const chatWindow = document.getElementById('chat-window');
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        /**
         * 部屋から退出する
         */
        function leaveRoom() {
            if (messagesRef) {
                // 退出メッセージを送信 (オプション)
                sendMessage(null, `${userName} が退出しました。`);
                
                // リスナーを解除
                messagesRef.off();
            }

            // 状態をリセット
            currentRoom = null;
            messagesRef = null;
            messagesList.innerHTML = '';
            
            // UIを切り替え
            chatView.style.display = 'none';
            setupView.style.display = 'block';
            
            alert('部屋から退出しました。');
            
            // ユーザー名を再度入力できるようにする (任意)
            usernameInput.disabled = false;
        }

    </script>
</body>
</html>
