<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sneak.io ドット描画・滑らか軌跡追従・重なり調整 (Slither.io風)</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #000000;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            width: 500px; 
        }
        
        #ui-overlay input, #ui-overlay button {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            width: 200px;
        }
        
        #ui-overlay button {
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- 色設定画面のスタイル --- */
        #colorSettings {
            display: none;
            padding: 20px 0;
        }

        /* プレビューエリア */
        #colorPreview {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px 5px;
            max-width: 400px; 
            margin: 0 auto 20px;
        }
        
        /* ヘビの頭のように大きく、間隔を狭く */
        .color-segment-preview {
            width: 20px; 
            height: 20px;
            border-radius: 50%;
            margin: 0 1px; 
            border: 2px solid #fff;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.1s;
        }

        .color-segment-preview.selected {
            border-color: #2ecc71;
            transform: scale(1.4); 
            box-shadow: 0 0 10px #2ecc71;
        }
        
        /* パレットと矢印のコンテナ */
        #paletteContainer {
            display: flex;
            align-items: flex-start; 
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .arrow-button {
            background: #555;
            color: white;
            padding: 5px 10px;
            margin: 0 5px;
            font-size: 1.5em;
            cursor: pointer;
            border-radius: 5px;
            user-select: none;
            transition: background 0.1s;
            height: 40px;
            line-height: 20px;
        }
        
        .arrow-button:hover {
            background: #777;
        }

        #colorPalette {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 5px;
            border-radius: 5px;
            width: 450px; 
            max-height: none; 
            overflow-y: visible; 
        }

        .color-option {
            width: 28px; 
            height: 28px; 
            border-radius: 50%;
            margin: 1px; 
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.1s;
        }
        /* 横15個で改行されるように調整 */
        .color-option:nth-child(15n+1) { 
            clear: left; 
        }

        .color-option:hover {
            border-color: #ccc;
        }
        /* --- ここまで色設定画面のスタイル --- */


        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 1.2em;
            z-index: 5;
        }
        
        #minimapCanvas {
            position: absolute;
            bottom: 10px;
            right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.7);
            z-index: 5;
        }

        /* --- ブーストボタンのスタイル修正 (さらに大きく、半透明に) --- */
        #boost-button {
            position: absolute;
            bottom: 20px; 
            left: 20px; 
            
            width: 120px; /* 拡大 */
            height: 120px; /* 拡大 */
            border-radius: 50%;
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            background-color: #2ecc71;
            color: white;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transition: background-color 0.1s, box-shadow 0.1s;
            
            opacity: 0.6; /* 半透明設定 */
            display: none; 
        }

        #boost-button.active {
            background-color: #27ae60;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.8);
            opacity: 0.8; /* アクティブ時は少し不透明に */
        }

        #boost-button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    
    <div id="score-display">
        体長: <span id="currentScore">100</span>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <canvas id="minimapCanvas" width="150" height="150"></canvas>
    
    <button id="boost-button">🚀 BOOST</button>

    <div id="ui-overlay">
        <div id="mainMenu">
            <h2>Sneak.io (Final)</h2>
            <input type="text" id="playerName" placeholder="名前を入力 (必須)">
            <button id="startButton">ゲームスタート</button>
            <button id="colorSettingsButton">🎨 ヘビの色設定</button>
            <p id="message" style="color: yellow; margin-top: 15px;"></p>
        </div>

        <div id="colorSettings">
            <h3>ヘビの色設定 (<span id="dotCount">13</span>箇所)</h3>
            <p style="font-size: 0.9em; margin-top: -10px;">👇 編集するドットを選択</p>
            <div id="colorPreview">
                </div>
            
            <p style="font-size: 0.9em; margin-top: 15px;">👇 色を選択 (明度: <span id="currentLightnessDisplay">60</span>%)</p>
            <div id="paletteContainer">
                <div class="arrow-button" id="brightnessDownButton" title="暗くする">&lt;</div>
                <div id="colorPalette">
                    </div>
                <div class="arrow-button" id="brightnessUpButton" title="明るくする">&gt;</div>
            </div>

            <button id="backToMenuButton" style="background-color: #3498db; margin-top: 20px;">メニューに戻る</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6aLjtLMsEt3ximM2nVRBqPWe7B2j0tDs",
            authDomain: "donguri-st1.firebaseapp.com",
            databaseURL: "https://donguri-st1-default-rtdb.firebaseio.com",
            projectId: "donguri-st1",
            storageBucket: "donguri-st1.firebasestorage.app",
            messagingSenderId: "999142601494",
            appId: "1:999142601494:web:db8bceed54e23e0cf21637",
            measurementId: "G-VZ1YJLMV1C"
        };
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const boostButton = document.getElementById('boost-button');
        const colorPalette = document.getElementById('colorPalette');
        const colorPreview = document.getElementById('colorPreview');
        const DOT_COUNT = 13; 

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 1500;
        const INITIAL_LENGTH = 100; 
        const INITIAL_SEGMENTS_COUNT = 5; 
        const FOOD_COUNT = 500; 
        const BASE_SPEED = 2.5;
        const BOOST_SPEED = BASE_SPEED * 2;
        const BOOST_CONSUMPTION_RATE = 2.0;
        const MIN_LENGTH_TO_BOOST = INITIAL_LENGTH * 0.5;
        
        const TURN_RATE = 0.12; 
        
        const CAMERA_SMOOTHING = 0.05; 
        const DECEASED_COLOR = '#ffffff'; 
        const INVULNERABLE_DURATION = 3000;
        const INTERPOLATION_STEP = 5; 

        const BASE_RADIUS = 5; 
        const MAX_RADIUS = 15; 
        const SEGMENT_OVERLAP_FACTOR = 0.7; 
        const TRAIL_STEP = 1; 
        
        // ★★★ 修正: 太くなるスピードを極限まで遅くする ★★★
        const RADIUS_GROWTH_RATE = 0.005; 
        
        // ★★★ 修正: セグメント増加のコストを大幅に下げる ★★★
        const SEGMENT_INITIAL_COST = 20; 
        const SEGMENT_COST_INCREASE = 30; 
        
        // ジョイスティック設定
        const JOYSTICK_RADIUS = 70;
        const JOYSTICK_KNOB_RADIUS = 25;
        // ジョイスティックが少し動いたときに角度が敏感に反応しすぎるのを防ぐデッドゾーン
        const JOYSTICK_DEADZONE_DISTANCE = 5; 

        let joystickCenter = null;
        let joystickCurrent = null;

        // 色相のベースとなる色（H値）を10度刻みで36色
        const BASE_HUES = Array.from({length: 36}, (_, i) => i * 10); 
        
        // 設定点を13個に増やし、初期色を設定
        const INITIAL_CUSTOM_COLORS = [
            '#FF0000', '#FF4000', '#FFFF00', '#40FF00', '#00FF00', '#0040FF', '#0000FF', 
            '#4B0082', '#9400D3', '#FF00FF', '#FF00A0', '#FFA000', '#FF0000'
        ];
        
        // 彩度レイヤーを追加: 低彩度(30), 中彩度(60), 高彩度(90)
        const SATURATION_LAYERS = [90, 60, 30]; 
        let currentLightness = 60;  // L値 (明度)

        let myPlayerId = null;
        let playerName = '';
        let mySnake = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            angle: 0,
            targetAngle: 0,
            length: INITIAL_LENGTH,
            segments: [],
            segmentsCount: INITIAL_SEGMENTS_COUNT, 
            score: 0,
            color: INITIAL_CUSTOM_COLORS[0], 
            customColors: [...INITIAL_CUSTOM_COLORS], 
            trail: [], 
            isInvulnerable: false,
            invulnerableEndTime: 0,
            isBoosting: false,
        };
        let isGameOver = true;
        
        let currentEditingSegment = 0; 

        let cameraX = 0;
        let cameraY = 0;
        let otherPlayers = {};
        let foodItems = []; 
        let localFoodItems = []; 
        let eatenFoodCount = 0; 
        
        // --- マルチタッチ対応のための変数 ---
        let joystickTouchId = null; 
        let boostTouchId = null;


        
        firebase.initializeApp(firebaseConfig);
        const playersRef = firebase.database().ref('players');
        const deceasedFoodRef = firebase.database().ref('deceasedFood'); 
        
        
        function initGame() {
            mySnake.x = Math.random() * WORLD_SIZE;
            mySnake.y = Math.random() * WORLD_SIZE;
            mySnake.angle = Math.random() * 2 * Math.PI;
            mySnake.targetAngle = mySnake.angle;
            mySnake.length = INITIAL_LENGTH;
            
            mySnake.segmentsCount = calculateSegmentsCount(mySnake.length); 

            const initialRadius = getHeadRadius(mySnake.length);
            const initialSpacing = initialRadius * 2 * SEGMENT_OVERLAP_FACTOR;

            mySnake.trail = []; 
            mySnake.segments = [];
            // 初期セグメントをヘビの初期位置から一定の間隔で配置
            for(let i=0; i<mySnake.segmentsCount; i++) {
                const segmentX = mySnake.x - i * initialSpacing * Math.cos(mySnake.angle);
                const segmentY = mySnake.y - i * initialSpacing * Math.sin(mySnake.angle);
                mySnake.trail.push({x: segmentX, y: segmentY});
                mySnake.segments.push({x: segmentX, y: segmentY});
            }

            mySnake.score = INITIAL_LENGTH;
            isGameOver = false;
            mySnake.isBoosting = false;
            mySnake.isInvulnerable = true;
            mySnake.invulnerableEndTime = Date.now() + INVULNERABLE_DURATION;
            eatenFoodCount = 0;
            
            localFoodItems = [];
            generateFood(FOOD_COUNT, 3, 5, 'normal'); 
            
            document.getElementById('currentScore').textContent = mySnake.score;
            boostButton.style.display = 'flex';

            // ジョイスティック操作のためのイベントリスナーを設定 (document全体でイベントを処理する)
            document.addEventListener('mousedown', handleInputDown);
            document.addEventListener('mousemove', handleInputMove);
            document.addEventListener('mouseup', handleInputUp);

            document.addEventListener('touchstart', handleInputDown, { passive: false });
            document.addEventListener('touchmove', handleInputMove, { passive: false });
            document.addEventListener('touchend', handleInputUp);
            
            setupBoostEvents();
            
            // プレイヤーIDの生成とFirebaseへの登録は、initGameの最後で実行する。
            myPlayerId = playersRef.push().key; 
            
            // ★★★ 修正: 接続が切れた場合にデータを自動で削除する設定 ★★★
            playersRef.child(myPlayerId).onDisconnect().remove(); 
            
            updateFirebase();

            requestAnimationFrame(gameLoop);
            
            if (window.syncInterval) clearInterval(window.syncInterval);
            window.syncInterval = setInterval(updateFirebase, 100);
        }
        
        function setupBoostEvents() {
            // ブーストとジョイスティックの干渉を避けるため、イベントは documentレベルで処理する
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // ブラウザ/タブが閉じられる/移動する際の処理 (ゲームオーバー処理をgameOver()に集約)
            window.addEventListener('beforeunload', () => {
                if (myPlayerId) {
                    // onDisconnectが設定されているため、ここで直接削除はしない
                    gameOver(false); 
                }
            });

            window.addEventListener('pagehide', () => {
                if (myPlayerId) {
                    gameOver(false); // 完全に非表示になる場合
                }
            });
        }

        function startBoost() {
            if (isGameOver || mySnake.length <= MIN_LENGTH_TO_BOOST) return;
            mySnake.isBoosting = true;
            boostButton.classList.add('active');
        }

        function endBoost() {
            mySnake.isBoosting = false;
            boostButton.classList.remove('active');
        }

        function handleVisibilityChange() {
            // タブが非アクティブになり、かつゲーム中の場合 (死体を残してメニューに戻る)
            if (document.hidden && !isGameOver && myPlayerId) {
                // ここでのgameOver呼び出しは、死体生成とonDisconnectのキャンセル（手動削除の準備）を行う
                gameOver(true); 
            } 
            // タブがアクティブに戻った場合は、メニュー画面が表示されている (gameOver()の結果)
        }
        
        // --- ジョイスティック/マルチタッチ制御のロジック ---

        function isTargetingBoostButton(x, y) {
            const rect = boostButton.getBoundingClientRect();
            
            // 円形の判定（中心からの距離）
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const radius = rect.width / 2;
            
            const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            
            return distance <= radius;
        }

        function handleInputDown(e) {
            e.preventDefault();
            if (isGameOver) return;
            
            if (e.type === 'mousedown') {
                const x = e.clientX;
                const y = e.clientY;
                
                if (isTargetingBoostButton(x, y)) {
                    startBoost();
                } else if (!joystickCenter) { 
                    // ジョイスティックが未操作の場合にのみ開始
                    joystickCenter = { x: x, y: y };
                    joystickCurrent = { x: x, y: y };
                }
            } else if (e.type === 'touchstart') {
                const changedTouches = e.changedTouches;
                
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    const x = touch.clientX;
                    const y = touch.clientY;
                    
                    if (isTargetingBoostButton(x, y) && boostTouchId === null) {
                        // ブースト操作の開始
                        startBoost();
                        boostTouchId = touch.identifier;
                    } else if (joystickTouchId === null && !isTargetingBoostButton(x, y)) {
                        // ジョイスティック操作の開始（ブーストボタン以外で）
                        joystickCenter = { x: x, y: y };
                        joystickCurrent = { x: x, y: y };
                        joystickTouchId = touch.identifier;
                    }
                }
            }
        }
        
        function handleInputMove(e) {
            e.preventDefault();
            if (isGameOver || (!joystickCenter && !e.touches)) return; 

            if (e.type === 'mousemove') {
                if (!joystickCenter) return;
                
                const coords = { x: e.clientX, y: e.clientY };
                joystickCurrent = { x: coords.x, y: coords.y };

                // ジョイスティックの処理
                updateJoystickDirection(coords.x, coords.y);

            } else if (e.type === 'touchmove') {
                const touches = e.touches;

                for (let i = 0; i < touches.length; i++) {
                    const touch = touches[i];
                    
                    if (touch.identifier === joystickTouchId) {
                        // ジョイスティックの移動
                        const x = touch.clientX;
                        const y = touch.clientY;
                        joystickCurrent = { x: x, y: y };
                        updateJoystickDirection(x, y);
                    }
                    // ブーストボタンは移動で状態が変わらないため、ここでは処理しない
                }
            }
        }
        
        function updateJoystickDirection(x, y) {
            // ジョイスティックの中心からの差分
            const dx = x - joystickCenter.x;
            const dy = y - joystickCenter.y;
            
            // 距離を計算し、ジョイスティックの半径に制限
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // ★★★ 修正: JOYSTICK_DEADZONE_DISTANCE を利用して微小な動きを無視する ★★★
            if (distance > JOYSTICK_DEADZONE_DISTANCE) { 
                // 角度を計算
                mySnake.targetAngle = Math.atan2(dy, dx);

                if (distance > JOYSTICK_RADIUS) {
                    // つまみの位置を制限
                    const ratio = JOYSTICK_RADIUS / distance;
                    joystickCurrent.x = joystickCenter.x + dx * ratio;
                    joystickCurrent.y = joystickCenter.y + dy * ratio;
                }
            } else {
                 // デッドゾーン内の場合、ジョイスティックの位置をセンターに戻す（視覚的に）
                 joystickCurrent.x = joystickCenter.x;
                 joystickCurrent.y = joystickCenter.y;
            }
        }

        function handleInputUp(e) {
            if (isGameOver) return;

            if (e.type === 'mouseup') {
                // マウスアップでブーストとジョイスティックをリセット
                endBoost();
                joystickCenter = null;
                joystickCurrent = null;
            } else if (e.type === 'touchend') {
                const changedTouches = e.changedTouches;
                
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    
                    if (touch.identifier === boostTouchId) {
                        // ブースト操作の終了
                        endBoost();
                        boostTouchId = null;
                    } 
                    
                    if (touch.identifier === joystickTouchId) {
                        // ジョイスティック操作の終了
                        joystickCenter = null;
                        joystickCurrent = null;
                        joystickTouchId = null;
                    }
                }
            }
        }
        
        // --- ゲームロジック ---
        
        function generateFood(count, minSize, maxSize, type) {
            if (type === 'deceased') return; 

            for (let i = 0; i < count; i++) {
                const size = minSize + Math.random() * (maxSize - minSize);
                let color = `hsl(${Math.random() * 360}, 90%, 60%)`;
                
                localFoodItems.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    size: size,
                    color: color,
                    type: type || 'normal'
                });
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (isGameOver) return;

            if (mySnake.isBoosting) {
                mySnake.length -= BOOST_CONSUMPTION_RATE;
                mySnake.score = Math.round(mySnake.length);
                
                if (mySnake.length <= MIN_LENGTH_TO_BOOST) { 
                    endBoost();
                }
            }

            if (mySnake.isInvulnerable && Date.now() > mySnake.invulnerableEndTime) {
                mySnake.isInvulnerable = false;
            }
            
            updateSnakeMovement();
            updateCamera();

            drawScene();
            drawJoystick(); 
            drawMinimap();

            checkEatFood();
            
            if (!mySnake.isInvulnerable && checkCollision()) {
                gameOver(true); // 衝突死の場合はメニューに戻る
                return;
            }
            
            document.getElementById('currentScore').textContent = mySnake.score;

            requestAnimationFrame(gameLoop);
        }

        function getHeadRadius(length) {
            const radius = BASE_RADIUS + length * RADIUS_GROWTH_RATE;
            return Math.min(radius, MAX_RADIUS);
        }

        function calculateSegmentsCount(length) {
            if (length <= INITIAL_LENGTH) {
                return INITIAL_SEGMENTS_COUNT;
            }

            const addedLength = length - INITIAL_LENGTH; 
            
            let currentLength = 0;
            let addedSegments = 0;
            
            while (true) {
                const cost = SEGMENT_INITIAL_COST + (addedSegments * SEGMENT_COST_INCREASE);
                
                if (currentLength + cost > addedLength) {
                    break;
                }
                
                currentLength += cost;
                addedSegments++;
            }

            return INITIAL_SEGMENTS_COUNT + addedSegments;
        }

        function updateSnakeMovement() {
            let angleDiff = mySnake.targetAngle - mySnake.angle;
            // 短い方の角度差分を計算
            if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
            if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

            mySnake.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), TURN_RATE);

            const currentSpeed = mySnake.isBoosting ? BOOST_SPEED : BASE_SPEED;

            const dx = Math.cos(mySnake.angle) * currentSpeed;
            const dy = Math.sin(mySnake.angle) * currentSpeed;
            mySnake.x += dx;
            mySnake.y += dy;

            // 1. 新しい位置を軌跡の先頭に追加
            mySnake.trail.unshift({ x: mySnake.x, y: mySnake.y });

            mySnake.segmentsCount = calculateSegmentsCount(mySnake.length);

            const headRadius = getHeadRadius(mySnake.length);
            
            // 2. セグメント間の目標距離を計算
            const segmentDistance = headRadius * 2 * SEGMENT_OVERLAP_FACTOR; 
            const trailDistancePerSegment = segmentDistance; 
            
            // ヘビの体節数を調整 (増減ロジック)
            while (mySnake.segments.length < mySnake.segmentsCount) {
                const last = mySnake.segments[mySnake.segments.length - 1] || mySnake.trail[mySnake.trail.length - 1] || { x: mySnake.x, y: mySnake.y };
                mySnake.segments.push({ x: last.x, y: last.y });
            }
            while (mySnake.segments.length > mySnake.segmentsCount) {
                mySnake.segments.pop();
            }
            
            // 3. 軌跡からの距離ベースのサンプリング
            for (let i = 0; i < mySnake.segments.length; i++) {
                // 先頭のセグメントは常にヘビの現在位置
                if (i === 0) {
                    mySnake.segments[i].x = mySnake.trail[0].x;
                    mySnake.segments[i].y = mySnake.trail[0].y;
                    continue;
                }

                // 目標の距離（体節間の距離×体節のインデックス）
                const targetDistance = i * trailDistancePerSegment;
                
                let accumulatedDistance = 0;
                let foundPosition = false;

                for (let j = 0; j < mySnake.trail.length - 1; j++) {
                    const p1 = mySnake.trail[j];
                    const p2 = mySnake.trail[j + 1];
                    const segmentLength = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));

                    if (accumulatedDistance + segmentLength >= targetDistance) {
                        // 目標距離をまたぐ位置を見つけた
                        const excessDistance = targetDistance - accumulatedDistance;
                        const ratio = excessDistance / segmentLength;
                        
                        mySnake.segments[i].x = p1.x + (p2.x - p1.x) * ratio;
                        mySnake.segments[i].y = p1.y + (p2.y - p1.y) * ratio;
                        foundPosition = true;
                        break;
                    }

                    accumulatedDistance += segmentLength;
                }
                
                // 軌跡が足りない場合、最後の点を維持
                if (!foundPosition) {
                    const last = mySnake.trail[mySnake.trail.length - 1];
                    if (last) {
                        mySnake.segments[i].x = last.x;
                        mySnake.segments[i].y = last.y;
                    }
                }
            }
            
            // 4. 軌跡の長さを適切な長さに制限
            const trailIndexNeeded = mySnake.segmentsCount * 20; 
            if (mySnake.trail.length > trailIndexNeeded) {
                 mySnake.trail.splice(trailIndexNeeded);
            }


            if (mySnake.x < 0 || mySnake.x > WORLD_SIZE || mySnake.y < 0 || mySnake.y > WORLD_SIZE) {
                gameOver(true); 
            }
        }
        
        function checkEatFood() {
            const head = mySnake.segments[0];
            const headRadius = getHeadRadius(mySnake.length);

            const allFood = [...foodItems, ...localFoodItems];
            const foodToKeep = [];

            allFood.forEach(food => {
                const dist = Math.sqrt(Math.pow(head.x - food.x, 2) + Math.pow(head.y - food.y, 2));
                
                if (dist < headRadius + food.size) { 
                    
                    let growthAmount;
                    
                    if (food.isDeceased) {
                        // ★★★ 修正: 死体の場合、元の成長量 (200 + food.size * 50) を0.5倍にする ★★★
                        growthAmount = (200 + food.size * 50) * 0.5; 
                        deceasedFoodRef.child(food.id).remove();

                    } else {
                        // 通常の餌
                        growthAmount = 20 + food.size * 5; 
                        eatenFoodCount++;
                    }


                    mySnake.length += growthAmount; 
                    mySnake.score = Math.round(mySnake.length);
                    
                } else {
                    foodToKeep.push(food);
                }
            });

            localFoodItems = foodToKeep.filter(f => !f.isDeceased);
            
            if (localFoodItems.length < FOOD_COUNT) {
                generateFood(FOOD_COUNT - localFoodItems.length, 3, 5, 'normal');
            }
        }
        
        function checkCollision() {
            const head = mySnake.segments[0];
            const headRadius = getHeadRadius(mySnake.length); 
            
            for (const playerId in otherPlayers) {
                const other = otherPlayers[playerId];
                const otherSegments = other.interpolatedSegments || [];
                const otherHeadRadius = getHeadRadius(other.length || INITIAL_LENGTH); 
                
                if (other.isInvulnerable) continue;

                for (let i = 0; i < otherSegments.length; i++) { 
                    const segment = otherSegments[i];
                    const dist = Math.sqrt(Math.pow(head.x - segment.x, 2) + Math.pow(head.y - segment.y, 2));
                    
                    if (dist < headRadius + otherHeadRadius) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        /**
         * ゲームオーバー処理。死体を残し、オプションでメニューに戻る。
         * @param {boolean} showMenu - trueの場合、メニュー画面を表示する
         */
        function gameOver(showMenu = true) {
            if(isGameOver) return; 

            isGameOver = true;
            clearInterval(window.syncInterval);
            
            endBoost();

            // ★★★ 修正: onDisconnectをキャンセルする（手動削除前に実行） ★★★
            if (myPlayerId) {
                 playersRef.child(myPlayerId).onDisconnect().cancel();
            }

            // --- 死亡時の処理 (死体をまく) ---
            const snakeLengthForDeath = mySnake.length;
            // ★★★ 修正: 死体のサイズ（スコア価値）を計算 ★★★
            const deadFoodSize = getHeadRadius(snakeLengthForDeath) * 0.8; 
            
            mySnake.segments.forEach(segment => {
                const deadFoodId = deceasedFoodRef.push().key; 

                deceasedFoodRef.child(deadFoodId).set({
                    x: segment.x + (Math.random() - 0.5) * 5, 
                    y: segment.y + (Math.random() - 0.5) * 5,
                    size: deadFoodSize, // ★★★ 修正: 色を削除し、サイズと座標のみ保存 ★★★
                    isDeceased: true, 
                    id: deadFoodId
                });
            });

            // プレイヤーをFirebaseから削除
            if (myPlayerId) {
                playersRef.child(myPlayerId).remove();
            }
            myPlayerId = null;
            
            // --- UI処理 ---
            if (showMenu) {
                document.getElementById('message').textContent = `ゲームオーバー！最終体長: ${mySnake.score}`;
                document.getElementById('ui-overlay').style.display = 'block';
                document.getElementById('mainMenu').style.display = 'block';
                document.getElementById('colorSettings').style.display = 'none';
            }
            boostButton.style.display = 'none';
            
            // イベントリスナーを削除（次回initGameで再設定）
            document.removeEventListener('mousedown', handleInputDown);
            document.removeEventListener('mousemove', handleInputMove);
            document.removeEventListener('mouseup', handleInputUp);
            document.removeEventListener('touchstart', handleInputDown);
            document.removeEventListener('touchmove', handleInputMove);
            document.removeEventListener('touchend', handleInputUp);
            
            // タッチIDもリセット
            joystickTouchId = null; 
            boostTouchId = null;
        }

        function updateCamera() {
            const targetX = mySnake.x - canvas.width / 2;
            const targetY = mySnake.y - canvas.height / 2;
            cameraX += (targetX - cameraX) * CAMERA_SMOOTHING; 
            cameraY += (targetY - cameraY) * CAMERA_SMOOTHING;
        }

        function worldToScreen(x, y) {
            return {
                x: x - cameraX,
                y: y - cameraY
            };
        }

        function drawScene() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 10;
            const screenTopLeft = worldToScreen(0, 0);
            ctx.strokeRect(screenTopLeft.x, screenTopLeft.y, WORLD_SIZE, WORLD_SIZE);
            
            [...foodItems, ...localFoodItems].forEach(food => {
                drawFood(food);
            });

            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                drawSnake(data);
            }
            
            drawSnake(mySnake);
        }
        
        // --- ジョイスティックの描画 ---
        function drawJoystick() {
            if (!joystickCenter || isGameOver) return;
            
            // ジョイスティックが中央にある場合、描画Y座標は通常のまま。
            // タッチパネルでは、指で操作する際に手が邪魔にならないよう、ジョイスティックを画面下部にオフセットすることが一般的だが、
            // 現在のロジックではタップ位置をセンターとしているため、オフセットは不要。
            
            const centerX = joystickCenter.x;
            const centerY = joystickCenter.y;
            const currentX = joystickCurrent.x;
            const currentY = joystickCurrent.y;


            // 1. ジョイスティックの外枠 (ベース)
            ctx.beginPath();
            ctx.arc(centerX, centerY, JOYSTICK_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.stroke();

            // 2. ジョイスティックのつまみ (ノブ)
            ctx.beginPath();
            ctx.arc(currentX, currentY, JOYSTICK_KNOB_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();
        }

        // --- 描画関数 ---
        
        function drawSnake(snakeData) {
            const segments = snakeData.interpolatedSegments || snakeData.segments || [];
            if (segments.length === 0) return;

            const snakeLength = snakeData.length || INITIAL_LENGTH;
            const dotRadius = getHeadRadius(snakeLength); 
            
            const customColors = snakeData.customColors || INITIAL_CUSTOM_COLORS;
            const colorCount = customColors.length;

            let drawInvulnerableAura = snakeData.isInvulnerable;
            
            // ブースト時の発光設定
            const isBoosting = snakeData.isBoosting;
            if (isBoosting) {
                ctx.shadowColor = 'rgba(46, 204, 113, 1)'; 
                ctx.shadowBlur = dotRadius * 2; 
            }
            
            segments.forEach((segment, index) => {
                const screenPos = worldToScreen(segment.x, segment.y);
                
                let colorIndex = index % colorCount;
                let color = customColors[colorIndex];

                if (drawInvulnerableAura) {
                    if (Math.floor(Date.now() / 100) % 2 === 0) {
                        color = 'rgba(255, 255, 255, 0.7)';
                    }
                }

                ctx.fillStyle = color;
                const currentRadius = dotRadius * (1 - index * 0.002);
                
                ctx.beginPath();
                ctx.arc(screenPos.x, screenPos.y, currentRadius, 0, 2 * Math.PI);
                ctx.fill();
            });

            // ブースト後にシャドウをリセット
            if (isBoosting) {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }


            if (snakeData.name) {
                const headScreen = worldToScreen(segments[0].x, segments[0].y);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                if (drawInvulnerableAura) {
                    ctx.shadowColor = 'cyan';
                    ctx.shadowBlur = 10;
                }
                ctx.fillText(snakeData.name, headScreen.x, headScreen.y - dotRadius - 5); 
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'start';
            }
        }

        function drawFood(food) {
            const screenPos = worldToScreen(food.x, food.y);
            
            ctx.fillStyle = food.color;
            ctx.beginPath();
            ctx.arc(screenPos.x, screenPos.y, food.size, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        function drawMinimap() {
            const mapSize = minimapCanvas.width;
            minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            minimapCtx.fillRect(0, 0, mapSize, mapSize);
            
            const scale = mapSize / WORLD_SIZE;

            minimapCtx.strokeStyle = '#ffffff';
            minimapCtx.strokeRect(0, 0, mapSize, mapSize);

            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                const mapX = data.x * scale;
                const mapY = data.y * scale;
                
                minimapCtx.fillStyle = data.customColors ? data.customColors[0] : data.color;
                if (data.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                    minimapCtx.fillStyle = '#ffffff'; 
                }
                minimapCtx.beginPath();
                minimapCtx.arc(mapX, mapY, 2, 0, 2 * Math.PI);
                minimapCtx.fill();
            }

            const myMapX = mySnake.x * scale;
            const myMapY = mySnake.y * scale;

            minimapCtx.fillStyle = mySnake.customColors[0];
            if (mySnake.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                minimapCtx.fillStyle = '#ffffff'; 
            }
            minimapCtx.beginPath();
            minimapCtx.arc(myMapX, myMapY, 4, 0, 2 * Math.PI);
            minimapCtx.fill();

            const viewWidth = canvas.width * scale;
            const viewHeight = canvas.height * scale;
            const viewX = cameraX * scale; 
            const viewY = cameraY * scale;

            minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            minimapCtx.strokeRect(viewX, viewY, viewWidth, viewHeight);
        }

        function updateFirebase() {
            if (!myPlayerId || isGameOver) return;

            playersRef.child(myPlayerId).set({
                name: playerName,
                x: mySnake.x,
                y: mySnake.y,
                angle: mySnake.angle,
                length: mySnake.length,
                segmentsCount: mySnake.segmentsCount,
                customColors: mySnake.customColors, 
                segments: mySnake.segments.map(s => ({x: s.x, y: s.y})), 
                isInvulnerable: mySnake.isInvulnerable,
                isBoosting: mySnake.isBoosting, // Firebaseにブースト状態を送信
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });
        }
        
        function interpolateSegments(segments, length) {
            if (!segments || segments.length < 2) return segments;

            const segmentsCount = calculateSegmentsCount(length);
            const interpolated = [];
            
            for (let i = 0; i < segments.length - 1; i++) {
                const p1 = segments[i];
                const p2 = segments[i + 1];
                
                const distance = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                
                const numSteps = Math.ceil(distance / INTERPOLATION_STEP); 

                for (let j = 0; j < numSteps; j++) {
                    const factor = j / numSteps;
                    const x = p1.x + (p2.x - p1.x) * factor;
                    const y = p1.y + (p2.y - p1.y) * factor;
                    interpolated.push({ x, y });
                }
            }
            
            interpolated.push(segments[segments.length - 1]);

            const finalSegments = [];
            const step = interpolated.length / segmentsCount;
            for(let i = 0; i < segmentsCount; i++) {
                const index = Math.round(i * step);
                if (index < interpolated.length) {
                    finalSegments.push(interpolated[index]);
                }
            }
            
            return finalSegments;
        }


        playersRef.on('value', (snapshot) => {
            const playersData = snapshot.val();
            
            const playerIds = Object.keys(playersData || {});
            
            for (const id in otherPlayers) {
                if (!playerIds.includes(id)) {
                    delete otherPlayers[id];
                }
            }

            for (const id in playersData) {
                if (id !== myPlayerId) {
                    const data = playersData[id];
                    
                    if (!otherPlayers[id]) {
                        otherPlayers[id] = { ...data, interpolatedSegments: [] };
                    } else {
                        Object.assign(otherPlayers[id], data);
                    }

                    otherPlayers[id].interpolatedSegments = interpolateSegments(
                        data.segments,
                        data.length || INITIAL_LENGTH
                    );
                }
            }
        });

        deceasedFoodRef.on('value', (snapshot) => {
            const deceasedData = snapshot.val();
            foodItems = [];
            
            for (const id in deceasedData) {
                if (deceasedData[id]) {
                     // ★★★ 修正: ローカルでの描画用に色を設定 ★★★
                     foodItems.push({ 
                        ...deceasedData[id], 
                        color: DECEASED_COLOR // 取得したデータにローカルで色を追加
                     });
                }
            }
        });

        // --- HSL helper function ---
        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        // --- UI / イベント処理 ---

        function generateColorPalette() {
            colorPalette.innerHTML = '';
            
            // 色相（36色）× 彩度（3種類）のパレットを生成 (合計 108色)
            SATURATION_LAYERS.forEach(s => {
                BASE_HUES.forEach(h => {
                    const colorHex = hslToHex(h, s, currentLightness);
                    
                    const colorOption = document.createElement('div');
                    colorOption.className = 'color-option';
                    colorOption.style.backgroundColor = colorHex;
                    colorOption.dataset.color = colorHex;
                    colorOption.addEventListener('click', () => selectColor(colorHex));
                    colorPalette.appendChild(colorOption);
                });
            });
            
            // 無彩色（白・灰色・黒）を追加 (6色)
            [100, 80, 60, 40, 20, 0].forEach(l => {
                const colorHex = hslToHex(0, 0, l);
                const colorOption = document.createElement('div');
                colorOption.className = 'color-option';
                colorOption.style.backgroundColor = colorHex;
                colorOption.dataset.color = colorHex;
                colorOption.addEventListener('click', () => selectColor(colorHex));
                colorPalette.appendChild(colorOption);
            });
            
            document.getElementById('currentLightnessDisplay').textContent = currentLightness;
        }


        function setupColorSettings() {
            colorPreview.innerHTML = '';
            for (let i = 0; i < DOT_COUNT; i++) {
                const segmentDiv = document.createElement('div');
                segmentDiv.className = 'color-segment-preview';
                segmentDiv.style.backgroundColor = mySnake.customColors[i];
                segmentDiv.dataset.index = i;
                
                if (i > 0 && i % 6 === 0) { 
                    segmentDiv.style.clear = 'left';
                    segmentDiv.style.marginTop = '5px';
                }

                if (i === currentEditingSegment) {
                    segmentDiv.classList.add('selected');
                }
                segmentDiv.addEventListener('click', () => selectSegmentToEdit(i));
                colorPreview.appendChild(segmentDiv);
            }
            
            generateColorPalette();
        }
        
        function selectSegmentToEdit(index) {
            currentEditingSegment = index;
            document.querySelectorAll('.color-segment-preview').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
        }

        function selectColor(color) {
            mySnake.customColors[currentEditingSegment] = color;
            document.querySelector(`.color-segment-preview[data-index="${currentEditingSegment}"]`).style.backgroundColor = color;
        }

        function adjustBrightness(change) {
            currentLightness = Math.max(0, Math.min(100, currentLightness + change));
            generateColorPalette();
        }

        document.getElementById('brightnessDownButton').addEventListener('click', () => {
            adjustBrightness(-10); 
        });

        document.getElementById('brightnessUpButton').addEventListener('click', () => {
            adjustBrightness(10); 
        });

        document.getElementById('colorSettingsButton').addEventListener('click', () => {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('colorSettings').style.display = 'block';
            setupColorSettings();
        });

        document.getElementById('backToMenuButton').addEventListener('click', () => {
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('colorSettings').style.display = 'none';
        });

        document.getElementById('startButton').addEventListener('click', () => {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                document.getElementById('message').textContent = '名前を入力してください！';
                return;
            }
            
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('message').textContent = '';
            initGame();
        });

        setupColorSettings();

    </script>
