<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sneak.io ドット描画・滑らか軌跡追従・重なり調整 (ブースト機能追加)</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #000000;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
        }
        
        #ui-overlay input, #ui-overlay button {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            width: 200px;
        }
        
        #ui-overlay button {
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 1.2em;
            z-index: 5;
        }
        
        #minimapCanvas {
            position: absolute;
            bottom: 10px;
            right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.7);
            z-index: 5;
        }

        #boost-button {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 5;
            display: none;
            user-select: none;
            transition: background-color 0.1s;
        }

        #boost-button.active {
            background-color: #27ae60;
        }

        #boost-button:active {
            transform: translateX(-50%) scale(0.95);
        }
    </style>
</head>
<body>
    
    <div id="score-display">
        体長: <span id="currentScore">100</span>
    </div>

    <canvas id="gameCanvas"></canvas>
    
    <canvas id="minimapCanvas" width="150" height="150"></canvas>
    
    <div id="boost-button">🚀 BOOST</div>

    <div id="ui-overlay">
        <h2>Sneak.io (Final)</h2>
        <input type="text" id="playerName" placeholder="名前を入力 (必須)">
        <button id="startButton">ゲームスタート</button>
        <p id="message" style="color: yellow; margin-top: 15px;"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA6aLjtLMsEt3ximM2nVRBqPWe7B2j0tDs",
            authDomain: "donguri-st1.firebaseapp.com",
            databaseURL: "https://donguri-st1-default-rtdb.firebaseio.com",
            projectId: "donguri-st1",
            storageBucket: "donguri-st1.firebasestorage.app",
            messagingSenderId: "999142601494",
            appId: "1:999142601494:web:db8bceed54e23e0cf21637",
            measurementId: "G-VZ1YJLMV1C"
        };
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');
        const boostButton = document.getElementById('boost-button');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const WORLD_SIZE = 1500;
        const INITIAL_LENGTH = 100; 
        const INITIAL_SEGMENTS_COUNT = 5; 
        const FOOD_COUNT = 500; 
        const BASE_SPEED = 2.5;
        const BOOST_SPEED = BASE_SPEED * 2;
        const BOOST_CONSUMPTION_RATE = 2.0;
        const MIN_LENGTH_TO_BOOST = INITIAL_LENGTH * 0.5;
        const TURN_RATE = 0.05; 
        const CAMERA_SMOOTHING = 0.05; 
        const DECEASED_COLOR = '#ffffff'; 
        const INVULNERABLE_DURATION = 3000;
        const INTERPOLATION_STEP = 5; // 相手のセグメント補間距離

        const OVERLAP_FACTOR = 0.8; 
        const TRAIL_STEP = 1; 

        
        let myPlayerId = null;
        let playerName = '';
        let mySnake = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            angle: 0,
            targetAngle: 0,
            length: INITIAL_LENGTH,
            segments: [],
            segmentsCount: INITIAL_SEGMENTS_COUNT, 
            score: 0,
            color: '#' + Math.floor(Math.random()*16777215).toString(16),
            trail: [], 
            isInvulnerable: false,
            invulnerableEndTime: 0,
            isBoosting: false,
        };
        let isGameOver = true;
        
        let cameraX = 0;
        let cameraY = 0;
        let otherPlayers = {};
        let foodItems = []; 
        let localFoodItems = []; 
        let eatenFoodCount = 0; 

        
        firebase.initializeApp(firebaseConfig);
        const playersRef = firebase.database().ref('players');
        const deceasedFoodRef = firebase.database().ref('deceasedFood'); 
        
        
        function initGame() {
            mySnake.x = Math.random() * WORLD_SIZE;
            mySnake.y = Math.random() * WORLD_SIZE;
            mySnake.angle = Math.random() * 2 * Math.PI;
            mySnake.targetAngle = mySnake.angle;
            mySnake.length = INITIAL_LENGTH;
            mySnake.segmentsCount = INITIAL_SEGMENTS_COUNT;

            const initialRadius = getHeadRadius(INITIAL_SEGMENTS_COUNT);
            const initialSpacing = initialRadius * 2 * OVERLAP_FACTOR;

            mySnake.trail = []; 
            mySnake.segments = [];
            for(let i=0; i<mySnake.segmentsCount; i++) {
                mySnake.trail.push({x: mySnake.x - i * initialSpacing, y: mySnake.y});
                mySnake.segments.push({x: mySnake.x - i * initialSpacing, y: mySnake.y});
            }

            mySnake.score = INITIAL_LENGTH;
            isGameOver = false;
            mySnake.isBoosting = false;
            mySnake.isInvulnerable = true;
            mySnake.invulnerableEndTime = Date.now() + INVULNERABLE_DURATION;
            eatenFoodCount = 0;
            
            localFoodItems = [];
            generateFood(FOOD_COUNT, 3, 5, 'normal'); 
            
            document.getElementById('currentScore').textContent = mySnake.score;
            boostButton.style.display = 'flex';

            canvas.addEventListener('mousemove', handleInput);
            canvas.addEventListener('touchmove', handleInput, { passive: false });
            setupBoostEvents();
            
            updateFirebase();

            requestAnimationFrame(gameLoop);
            
            if (window.syncInterval) clearInterval(window.syncInterval);
            window.syncInterval = setInterval(updateFirebase, 100);
        }
        
        function setupBoostEvents() {
            boostButton.addEventListener('mousedown', startBoost);
            document.addEventListener('mouseup', endBoost);
            
            document.addEventListener('visibilitychange', handleVisibilityChange);

            boostButton.addEventListener('touchstart', (e) => {
                e.preventDefault();
                startBoost();
            });
            document.addEventListener('touchend', endBoost);
        }

        function startBoost() {
            if (isGameOver || mySnake.length <= MIN_LENGTH_TO_BOOST) return;
            mySnake.isBoosting = true;
            boostButton.classList.add('active');
        }

        function endBoost() {
            mySnake.isBoosting = false;
            boostButton.classList.remove('active');
        }

        function handleVisibilityChange() {
            if (document.hidden && !isGameOver && myPlayerId) {
                playersRef.child(myPlayerId).remove();
                clearInterval(window.syncInterval);
                isGameOver = true;
            } else if (!document.hidden && isGameOver && myPlayerId === null) {
                
            }
        }


        function handleInput(e) {
            e.preventDefault();
            if (isGameOver) return;
            
            let clientX, clientY;

            if (e.touches && e.touches.length > 0) {
                if (e.touches[0].target === boostButton) return;
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const mouseX = clientX - canvas.getBoundingClientRect().left;
            const mouseY = clientY - canvas.getBoundingClientRect().top;

            const headXScreen = canvas.width / 2;
            const headYScreen = canvas.height / 2;
            
            mySnake.targetAngle = Math.atan2(mouseY - headYScreen, mouseX - headXScreen);
        }
        
        function generateFood(count, minSize, maxSize, type) {
            if (type === 'deceased') return; 

            for (let i = 0; i < count; i++) {
                const size = minSize + Math.random() * (maxSize - minSize);
                let color = `hsl(${Math.random() * 360}, 90%, 60%)`;
                
                localFoodItems.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    size: size,
                    color: color,
                    type: type || 'normal'
                });
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (isGameOver) return;

            if (mySnake.isBoosting) {
                mySnake.length -= BOOST_CONSUMPTION_RATE;
                mySnake.score = Math.round(mySnake.length);
                
                if (mySnake.length <= MIN_LENGTH_TO_BOOST) { 
                    endBoost();
                }
            }

            if (mySnake.isInvulnerable && Date.now() > mySnake.invulnerableEndTime) {
                mySnake.isInvulnerable = false;
            }
            
            updateSnakeMovement();
            updateCamera();

            drawScene();
            drawMinimap();

            checkEatFood();
            
            if (!mySnake.isInvulnerable && checkCollision()) {
                gameOver();
                return;
            }
            
            document.getElementById('currentScore').textContent = mySnake.score;

            requestAnimationFrame(gameLoop);
        }

        function getHeadRadius(segmentsCount) {
            const baseRadius = 5;
            const growthFactor = 0.5; 
            return baseRadius + segmentsCount * growthFactor;
        }

        function updateSnakeMovement() {
            let angleDiff = mySnake.targetAngle - mySnake.angle;
            if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
            if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;

            mySnake.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), TURN_RATE);

            const currentSpeed = mySnake.isBoosting ? BOOST_SPEED : BASE_SPEED;

            const dx = Math.cos(mySnake.angle) * currentSpeed;
            const dy = Math.sin(mySnake.angle) * currentSpeed;
            mySnake.x += dx;
            mySnake.y += dy;

            mySnake.trail.unshift({ x: mySnake.x, y: mySnake.y });

            const INITIAL_POINTS = 4 * 20; 
            const totalGrowthPoints = mySnake.length - INITIAL_LENGTH;
            const growthSegments = Math.floor(Math.max(0, totalGrowthPoints) / INITIAL_POINTS); 
            
            mySnake.segmentsCount = Math.max(INITIAL_SEGMENTS_COUNT, INITIAL_SEGMENTS_COUNT + growthSegments);
            
            while (mySnake.segments.length < mySnake.segmentsCount) {
                const last = mySnake.segments[mySnake.segments.length - 1] || mySnake.trail[mySnake.trail.length - 1] || { x: mySnake.x, y: mySnake.y };
                mySnake.segments.push({ x: last.x, y: last.y });
            }
            while (mySnake.segments.length > mySnake.segmentsCount) {
                mySnake.segments.pop();
            }

            const headRadius = getHeadRadius(mySnake.segmentsCount);
            const segmentDistance = headRadius * 2 * OVERLAP_FACTOR; 
            const stepsPerSegment = segmentDistance / currentSpeed * TRAIL_STEP; 
            
            for (let i = 0; i < mySnake.segments.length; i++) {
                const index = Math.round(i * stepsPerSegment); 
                
                if (index < mySnake.trail.length) {
                    mySnake.segments[i].x = mySnake.trail[index].x;
                    mySnake.segments[i].y = mySnake.trail[index].y;
                } else {
                    const lastTrailPos = mySnake.trail[mySnake.trail.length - 1];
                    if (lastTrailPos) {
                        mySnake.segments[i].x = lastTrailPos.x;
                        mySnake.segments[i].y = lastTrailPos.y;
                    }
                }
            }
            
            const maxLengthNeeded = mySnake.segmentsCount * stepsPerSegment + 100;
            if (mySnake.trail.length > maxLengthNeeded) {
                mySnake.trail.splice(maxLengthNeeded);
            }

            if (mySnake.x < 0 || mySnake.x > WORLD_SIZE || mySnake.y < 0 || mySnake.y > WORLD_SIZE) {
                gameOver();
            }
        }
        
        function checkEatFood() {
            const head = mySnake.segments[0];
            const headRadius = getHeadRadius(mySnake.segmentsCount);

            const allFood = [...foodItems, ...localFoodItems];
            const foodToKeep = [];

            allFood.forEach(food => {
                const dist = Math.sqrt(Math.pow(head.x - food.x, 2) + Math.pow(head.y - food.y, 2));
                
                if (dist < headRadius + food.size) { 
                    const growthAmount = 5 + food.size * 2;
                    mySnake.length += growthAmount; 
                    mySnake.score = Math.round(mySnake.length);
                    
                    if (food.isDeceased) {
                        deceasedFoodRef.child(food.id).remove();
                    } else {
                        eatenFoodCount++;
                    }

                } else {
                    foodToKeep.push(food);
                }
            });

            localFoodItems = foodToKeep.filter(f => !f.isDeceased);
            
            if (localFoodItems.length < FOOD_COUNT) {
                generateFood(FOOD_COUNT - localFoodItems.length, 3, 5, 'normal');
            }
        }
        
        function checkCollision() {
            const head = mySnake.segments[0];
            const headRadius = getHeadRadius(mySnake.segmentsCount); 
            
            for (const playerId in otherPlayers) {
                const other = otherPlayers[playerId];
                const otherSegments = other.interpolatedSegments || [];
                const otherHeadRadius = getHeadRadius(other.segmentsCount || INITIAL_SEGMENTS_COUNT); 
                
                if (other.isInvulnerable) continue;

                for (let i = 0; i < otherSegments.length; i++) { 
                    const segment = otherSegments[i];
                    const dist = Math.sqrt(Math.pow(head.x - segment.x, 2) + Math.pow(head.y - segment.y, 2));
                    
                    if (dist < headRadius + otherHeadRadius) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        function gameOver() {
            if(isGameOver) return; 

            isGameOver = true;
            clearInterval(window.syncInterval);
            
            endBoost();

            mySnake.segments.forEach(segment => {
                const deadFoodId = deceasedFoodRef.push().key; 

                deceasedFoodRef.child(deadFoodId).set({
                    x: segment.x + (Math.random() - 0.5) * 5, 
                    y: segment.y + (Math.random() - 0.5) * 5,
                    size: getHeadRadius(mySnake.segmentsCount) * 0.8, 
                    color: DECEASED_COLOR, 
                    isDeceased: true, 
                    id: deadFoodId
                });
            });

            playersRef.child(myPlayerId).remove();
            myPlayerId = null;
            
            document.getElementById('message').textContent = `ゲームオーバー！最終体長: ${mySnake.score}`;
            document.getElementById('ui-overlay').style.display = 'block';
            boostButton.style.display = 'none';
            
            canvas.removeEventListener('mousemove', handleInput);
            canvas.removeEventListener('touchmove', handleInput, { passive: false });
        }

        function updateCamera() {
            const targetX = mySnake.x - canvas.width / 2;
            const targetY = mySnake.y - canvas.height / 2;
            cameraX += (targetX - cameraX) * CAMERA_SMOOTHING; 
            cameraY += (targetY - cameraY) * CAMERA_SMOOTHING;
        }

        function worldToScreen(x, y) {
            return {
                x: x - cameraX,
                y: y - cameraY
            };
        }

        function drawScene() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 10;
            const screenTopLeft = worldToScreen(0, 0);
            ctx.strokeRect(screenTopLeft.x, screenTopLeft.y, WORLD_SIZE, WORLD_SIZE);
            
            [...foodItems, ...localFoodItems].forEach(food => {
                drawFood(food);
            });

            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                drawSnake(data);
            }
            
            drawSnake(mySnake);
        }
        
        function drawSnake(snakeData) {
            // 相手の蛇の場合、補間されたセグメントを使用
            const segments = snakeData.interpolatedSegments || snakeData.segments || [];
            if (segments.length === 0) return;

            const dotRadius = getHeadRadius(snakeData.segmentsCount || INITIAL_SEGMENTS_COUNT);

            let color = snakeData.color;
            let drawInvulnerableAura = snakeData.isInvulnerable;
            
            if (drawInvulnerableAura) {
                if (Math.floor(Date.now() / 100) % 2 === 0) {
                    color = 'rgba(255, 255, 255, 0.7)';
                }
            }

            ctx.fillStyle = color;
            segments.forEach((segment, index) => {
                const screenPos = worldToScreen(segment.x, segment.y);
                
                const currentRadius = dotRadius * (1 - index * 0.002);
                
                ctx.beginPath();
                ctx.arc(screenPos.x, screenPos.y, currentRadius, 0, 2 * Math.PI);
                ctx.fill();
            });

            if (snakeData.name) {
                const headScreen = worldToScreen(segments[0].x, segments[0].y);
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                if (drawInvulnerableAura) {
                    ctx.shadowColor = 'cyan';
                    ctx.shadowBlur = 10;
                }
                ctx.fillText(snakeData.name, headScreen.x, headScreen.y - dotRadius - 5); 
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'start';
            }
        }

        function drawFood(food) {
            const screenPos = worldToScreen(food.x, food.y);
            
            ctx.fillStyle = food.color;
            ctx.beginPath();
            ctx.arc(screenPos.x, screenPos.y, food.size, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        function drawMinimap() {
            const mapSize = minimapCanvas.width;
            minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            minimapCtx.fillRect(0, 0, mapSize, mapSize);
            
            const scale = mapSize / WORLD_SIZE;

            minimapCtx.strokeStyle = '#ffffff';
            minimapCtx.strokeRect(0, 0, mapSize, mapSize);

            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                const mapX = data.x * scale;
                const mapY = data.y * scale;
                
                minimapCtx.fillStyle = data.color;
                if (data.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                    minimapCtx.fillStyle = '#ffffff'; 
                }
                minimapCtx.beginPath();
                minimapCtx.arc(mapX, mapY, 2, 0, 2 * Math.PI);
                minimapCtx.fill();
            }

            const myMapX = mySnake.x * scale;
            const myMapY = mySnake.y * scale;

            minimapCtx.fillStyle = mySnake.color;
            if (mySnake.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                minimapCtx.fillStyle = '#ffffff'; 
            }
            minimapCtx.beginPath();
            minimapCtx.arc(myMapX, myMapY, 4, 0, 2 * Math.PI);
            minimapCtx.fill();

            const viewWidth = canvas.width * scale;
            const viewHeight = canvas.height * scale;
            const viewX = cameraX * scale; 
            const viewY = cameraY * scale;

            minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            minimapCtx.strokeRect(viewX, viewY, viewWidth, viewHeight);
        }

        function updateFirebase() {
            if (!myPlayerId || isGameOver) return;

            playersRef.child(myPlayerId).set({
                name: playerName,
                x: mySnake.x,
                y: mySnake.y,
                angle: mySnake.angle,
                length: mySnake.length,
                segmentsCount: mySnake.segmentsCount,
                color: mySnake.color,
                segments: mySnake.segments.map(s => ({x: s.x, y: s.y})), // 全セグメントを送信
                isInvulnerable: mySnake.isInvulnerable,
                isBoosting: mySnake.isBoosting,
                updatedAt: firebase.database.ServerValue.TIMESTAMP
            });
        }
        
        // 相手のセグメントを補間して滑らかにする関数
        function interpolateSegments(segments, segmentsCount) {
            if (!segments || segments.length < 2) return segments;

            const interpolated = [];
            
            // サーバーから送られたセグメントの数と、本来描画すべきセグメント数の比率
            const ratio = segments.length / segmentsCount;

            for (let i = 0; i < segments.length - 1; i++) {
                const p1 = segments[i];
                const p2 = segments[i + 1];
                
                // セグメント間の距離
                const distance = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                
                // 1セグメントあたりの描画ステップ数
                const numSteps = Math.ceil(distance / INTERPOLATION_STEP); 

                // 補間ステップ
                for (let j = 0; j < numSteps; j++) {
                    const factor = j / numSteps;
                    const x = p1.x + (p2.x - p1.x) * factor;
                    const y = p1.y + (p2.y - p1.y) * factor;
                    interpolated.push({ x, y });
                }
            }
            
            // 最後のセグメントを追加
            interpolated.push(segments[segments.length - 1]);

            // 最終的に必要なセグメント数に合わせる
            const finalSegments = [];
            const step = interpolated.length / segmentsCount;
            for(let i = 0; i < segmentsCount; i++) {
                const index = Math.round(i * step);
                if (index < interpolated.length) {
                    finalSegments.push(interpolated[index]);
                }
            }
            
            return finalSegments;
        }


        playersRef.on('value', (snapshot) => {
            const playersData = snapshot.val();
            
            for (const id in otherPlayers) {
                if (!playersData[id]) {
                    delete otherPlayers[id];
                }
            }

            for (const id in playersData) {
                if (id !== myPlayerId) {
                    const data = playersData[id];
                    
                    if (!otherPlayers[id]) {
                        otherPlayers[id] = { ...data, interpolatedSegments: [] };
                    } else {
                        // 既存のデータを更新
                        Object.assign(otherPlayers[id], data);
                    }

                    // 相手のセグメントを補間して滑らかにする
                    otherPlayers[id].interpolatedSegments = interpolateSegments(
                        data.segments,
                        data.segmentsCount || INITIAL_SEGMENTS_COUNT
                    );
                }
            }
        });

        deceasedFoodRef.on('value', (snapshot) => {
            const deceasedData = snapshot.val();
            foodItems = [];
            
            for (const id in deceasedData) {
                if (deceasedData[id]) {
                     foodItems.push(deceasedData[id]);
                }
            }
        });

        document.getElementById('startButton').addEventListener('click', () => {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                document.getElementById('message').textContent = '名前を入力してください！';
                return;
            }
            
            myPlayerId = playersRef.push().key;
            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('message').textContent = '';
            initGame();
        });

        window.addEventListener('beforeunload', () => {
            if (myPlayerId) {
