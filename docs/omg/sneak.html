<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sneak.io ライン描画・超軽量データ送信 (Slither.io風)</title>
    <style>
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
            font-family: 'Arial', sans-serif;
            color: #ecf0f1;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            background-color: #000000;
            display: block;
        }

        #ui-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            z-index: 10;
            width: 500px; 
        }
        
        #ui-overlay input, #ui-overlay button {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            width: 200px;
        }

        /* サーバー選択ドロップダウンに既存のスタイルを適用 */
        #ui-overlay select {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            width: 200px;
        }
        
        #ui-overlay button {
            background-color: #e74c3c;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        /* --- 色設定画面のスタイル --- */
        #colorSettings {
            display: none;
            padding: 20px 0;

        /* プレビューエリア */
        #colorPreview {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            border: 1px solid #333;
            border-radius: 5px;
            padding: 10px 5px;
            max-width: 400px;
            margin: 0 auto 20px;

        /* ヘビの頭のように大きく、間隔を狭く */
        .color-segment-preview {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin: 0 1px;

        .color-segment-preview.selected {

        .arrow-button {
            background: #555;

            font-size: 1.5em;

            border-radius: 5px;

            transition: background 0.1s;
            height: 40px;
            line-height: 20px;
        }
        
        .arrow-button:hover {
            background: #777;
        }

        #colorPalette {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 5px;
            border-radius: 5px;
            width: 450px; 
            max-height: none; 
            overflow-y: visible;
        }

        .color-option {
            width: 28px;
            height: 28px; 
            border-radius: 50%;
            margin: 1px; 
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.1s;
        }
        /* 横15個で改行されるように調整 */
        .color-option:nth-child(15n+1) { 
            clear: left;
        }

        .color-option:hover {
            border-color: #ccc;
        }
        /* --- ここまで色設定画面のスタイル --- */


        #score-display {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            font-size: 1.2em;
            z-index: 5;
        }
        
        #minimapCanvas {
            position: absolute;
            bottom: 10px;
            right: 10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.7);
            z-index: 5;
        }

        /* --- ブーストボタンのスタイル修正 (さらに大きく、半透明に) --- */
        #boost-button {
            position: absolute;
            bottom: 20px; 
            left: 20px; 
            
            width: 120px; /* 拡大 */
            height: 120px;
            /* 拡大 */
            border-radius: 50%;
            
            display: flex;
            justify-content: center;
            align-items: center;
            
            background-color: #2ecc71;
            color: white;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            z-index: 5;
            user-select: none;
            transition: background-color 0.1s, box-shadow 0.1s;
            
            opacity: 0.6; /* 半透明設定 */
            display: none;
        }

        #boost-button.active {
            background-color: #27ae60;
            box-shadow: 0 0 15px rgba(46, 204, 113, 0.8);
            opacity: 0.8;
            /* アクティブ時は少し不透明に */
        }

        #boost-button:active {
            transform: scale(0.95);
        }
    </style>

        const WORLD_SIZE = 1500;

        const BASE_SPEED = 2.5;
        const BOOST_SPEED = BASE_SPEED * 2;
        const BOOST_CONSUMPTION_RATE = 0.5;

        const TURN_RATE = 0.3;
        const CAMERA_SMOOTHING = 0.05; 
        const DECEASED_COLOR = '#ffffff';
        const INVULNERABLE_DURATION = 3000;
        
        const BASE_RADIUS = 7; 
        const MAX_RADIUS = 15; 
        const RADIUS_GROWTH_RATE = 0.003; 
        
        const FOOD_VALUE = 15;
        // 描画用に送信するセグメントの間隔 (ワールド単位)
        const SEGMENT_DISTANCE = 8; 

        const JOYSTICK_RADIUS = 70;
        const JOYSTICK_KNOB_RADIUS = 25;
        const JOYSTICK_DEADZONE_DISTANCE = 5; 

        let joystickCenter = null;
        let joystickCurrent = null;
        
        let initialRadius = 0;
        const BASE_HUES = Array.from({length: 36}, (_, i) => i * 10);
        const INITIAL_CUSTOM_COLORS = [
            '#FF0000', '#FF4000', '#FFFF00', '#40FF00', '#00FF00', '#0040FF', '#0000FF', 
            '#4B0082', '#9400D3', '#FF00FF', '#FF00A0', '#FFA000', '#FF0000'
        ];
        const SATURATION_LAYERS = [90, 60, 30];
        let currentLightness = 60; 

        let myPlayerId = null;
        let playerName = '';
        let mySnake = {
            x: WORLD_SIZE / 2,
            y: WORLD_SIZE / 2,
            angle: 0,
            targetAngle: 0,
            length: INITIAL_LENGTH,
            score: 0,
            color: INITIAL_CUSTOM_COLORS[0], 
 
            customColors: [...INITIAL_CUSTOM_COLORS], 
            trail: [], // 高密度なローカルトレイル (衝突判定と描画に使用)
            isInvulnerable: false,
            invulnerableEndTime: 0,
            isBoosting: false,
   
        };
        let isGameOver = true;
        
        let currentEditingSegment = 0; 

        let cameraX = 0;
        let cameraY = 0;
        let otherPlayers = {};
        let foodItems = []; 
        let localFoodItems = []; 
        let eatenFoodCount = 0;
        let joystickTouchId = null; 
        let boostTouchId = null;
        
        // 以前のfirebase.initializeApp(...)を削除し、ゲーム開始時に初期化するように変更
        
        // ★★★ 共通データ圧縮・復元ユーティリティ ★★★

        /**
         * 数値を小数点第1位に丸める
         * @param {number} num 
         * @returns {number} 丸められた数値
         */
        const roundToOneDecimal = (num) => {
            if (num === null || num === undefined) return 0;
            return parseFloat(num.toFixed(1));
        }

        /**
         * 13個のHEXカラー配列をBase64文字列に圧縮
         * @param {string[]} hexArray - 例: ["#FF0000", "#00FF00", ...]
         * @returns {string} Base64文字列
         */
        function hexArrayToBase64(hexArray) {
            let bytes = '';
            for (const hex of hexArray) {
                const cleanHex = hex.substring(1);
                for (let i = 0; i < 6; i += 2) {
                    bytes += String.fromCharCode(parseInt(cleanHex.substring(i, i + 2), 16));
                }
            }
            return btoa(bytes);
        }

        /**
         * Base64文字列を13個のHEXカラー配列に復元
         * @param {string} base64Str - Base64文字列
         * @param {number} count - 期待されるカラー数 (13)
         * @returns {string[]} HEXカラー配列
         */
        function base64ToHexArray(base64Str, count = DOT_COUNT) {
            try {
      
                if (!base64Str || typeof base64Str !== 'string') return INITIAL_CUSTOM_COLORS;
                const bytes = atob(base64Str);
                const hexArray = [];
                for (let i = 0; i < bytes.length; i += 3) {
                    const r = bytes.charCodeAt(i).toString(16).padStart(2, '0');
                    const g = bytes.charCodeAt(i + 1).toString(16).padStart(2, '0');
                    const b = bytes.charCodeAt(i + 2).toString(16).padStart(2, '0');
                    hexArray.push(`#${r}${g}${b}`.toUpperCase());
                }
                while (hexArray.length < count) {
                    hexArray.push(hexArray[hexArray.length - 1] || INITIAL_CUSTOM_COLORS[0]);
                }
                return hexArray;
            } catch (e) {
                console.error("Color decoding failed:", e);
                return INITIAL_CUSTOM_COLORS;
            }
        }
        // ★★★ ユーティリティ終わり ★★★

        /**
         * Firebaseを初期化し、データベース参照とリスナーを設定します。
         * ゲーム開始時に選択されたサーバー設定で呼び出されます。
         * @param {object} config - 選択されたFirebase設定オブジェクト
         */
        function initializeFirebase(config) {
            // 既に初期化されている場合は、そのインスタンスを削除 (または既存のインスタンスを再利用)
            if (firebaseAppInstance) {
                // 既存のリスナーを解除 (必須)
                if(playersRef) playersRef.off('value');
                if(deceasedFoodRef) deceasedFoodRef.off('value');

                // 既存のアプリを削除 (推奨)
                try {
                    firebaseAppInstance.delete();
                } catch (e) {
                    console.warn("Could not delete previous Firebase app instance:", e);
                }
            }
            
            // アプリを初期化し、インスタンスを保持
            firebaseAppInstance = firebase.initializeApp(config, 'selectedApp' + Date.now()); // ユニークな名前を付ける
            const database = firebaseAppInstance.database();
            
            // 参照を更新
            playersRef = database.ref('players');
            deceasedFoodRef = database.ref('deceasedFood');
            
            // 監視イベントを再設定
            setupFirebaseListeners();
        }

        /**
         * Firebaseのデータベースリスナーを設定します。
         * initializeFirebaseの後に呼び出されます。
         */
        function setupFirebaseListeners() {
            // playersRefのリスナーを再設定
            playersRef.on('value', (snapshot) => {
                const playersData = snapshot.val();
                
                const playerIds = Object.keys(playersData || {});
                
                for (const id in otherPlayers) {
                    
                    if (!playerIds.includes(id)) {
                        delete otherPlayers[id];
                    }
                }

                for (const id in playersData) {
                    if (id !== myPlayerId) {
                
                        const data = playersData[id];
                        // ★ 短縮されたフィールド名を復元し、色をデコード
                        const decodedColors = base64ToHexArray(data.c, DOT_COUNT); 
                        
                        const remoteData = {
                            name: data.n,
                            x: data.x,
       
                            y: data.y,
                            length: data.l,
                            customColors: decodedColors,
                            bodySegments: data.b || [],
                            // nullをfalseとして扱う
                            isInvulnerable: !!data.i, 
                            isBoosting: !!data.s,     
                       
                        };

                        if (!otherPlayers[id]) {
                            otherPlayers[id] = { ...remoteData };
                        } else {
                            Object.assign(otherPlayers[id], remoteData);
                        }

                        // 受信した bodySegments をそのまま描画パスとして使用
                        otherPlayers[id].bodySegments = data.b || [];
                    }
                }
            });

            // deceasedFoodRefのリスナーを再設定
            deceasedFoodRef.on('value', (snapshot) => {
                const deceasedData = snapshot.val();
                foodItems = [];
                
                for (const id in deceasedData) {
                    const data = deceasedData[id];
                    if (data) {
      
                        // ★ 短縮されたキーを復元
                         foodItems.push({ 
                            x: data.x,
                            y: data.y,
           
                            size: data.s,   // s -> size
                            value: data.v,  // v -> value
                            color: DECEASED_COLOR,
                         
                            isDeceased: true, 
                            id: id // FirebaseのキーをIDとして使用
                         });
     
                    }
                }
            });
        }


        
        function initGame() {
            // 太さ計算の基準として、初期体長の時の半径を保存
            initialRadius = getHeadRadius(INITIAL_LENGTH);
            mySnake.x = Math.random() * WORLD_SIZE;
            mySnake.y = Math.random() * WORLD_SIZE;
            mySnake.angle = Math.random() * 2 * Math.PI;
            mySnake.targetAngle = mySnake.angle;
            mySnake.length = INITIAL_LENGTH;
            
            mySnake.trail = [];
            // 初期状態のトレイルに、頭の位置を複数追加
            for(let i = 0; i < 100; i++) {
                 mySnake.trail.push({ x: mySnake.x, y: mySnake.y });
            }


            mySnake.score = INITIAL_LENGTH;
            isGameOver = false;
            mySnake.isBoosting = false;
            mySnake.isInvulnerable = true;
            mySnake.invulnerableEndTime = Date.now() + INVULNERABLE_DURATION;
            eatenFoodCount = 0;
            
            localFoodItems = [];
            generateFood(FOOD_COUNT, 3, 5, 'normal'); 
            
            document.getElementById('currentScore').textContent = mySnake.score;
            boostButton.style.display = 'flex';
            document.addEventListener('mousedown', handleInputDown);
            document.addEventListener('mousemove', handleInputMove);
            document.addEventListener('mouseup', handleInputUp);
            document.addEventListener('touchstart', handleInputDown, { passive: false });
            document.addEventListener('touchmove', handleInputMove, { passive: false });
            document.addEventListener('touchend', handleInputUp);
            
            setupBoostEvents();
            // Firebaseの参照がここで設定されていることを前提とする
            myPlayerId = playersRef.push().key; 
            playersRef.child(myPlayerId).onDisconnect().remove(); 
            
            updateFirebase();
            requestAnimationFrame(gameLoop);
            // データ送信間隔を 50ms に設定
            if (window.syncInterval) clearInterval(window.syncInterval);
            window.syncInterval = setInterval(updateFirebase, 50);
        }
        
        function setupBoostEvents() {
            window.addEventListener('beforeunload', () => {
                if (myPlayerId && !isGameOver) {
                    gameOver(false); 
                }
      
            });
        }

        function startBoost() {
            if (isGameOver || mySnake.length <= MIN_LENGTH_TO_BOOST) return;
            mySnake.isBoosting = true;
            boostButton.classList.add('active');
        }

        function endBoost() {
            mySnake.isBoosting = false;
            boostButton.classList.remove('active');
        }
        
        function isTargetingBoostButton(x, y) {
            const rect = boostButton.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const radius = rect.width / 2;
            const distance = Math.sqrt(Math.pow(x - centerX, 2) + Math.pow(y - centerY, 2));
            return distance <= radius;
        }

        function handleInputDown(e) {
            e.preventDefault();
            if (isGameOver) return;
            
            if (e.type === 'mousedown') {
                const x = e.clientX;
                const y = e.clientY;
                
                if (isTargetingBoostButton(x, y)) {
                    startBoost();
                } else if (!joystickCenter) { 
                    joystickCenter = { x: x, y: y };
                    joystickCurrent = { x: x, y: y };
                }
            } else if (e.type === 'touchstart') {
                const changedTouches = e.changedTouches;
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    const x = touch.clientX;
                    const y = touch.clientY;
                    
                    if (isTargetingBoostButton(x, y) && boostTouchId === null) {
                        startBoost();
                        boostTouchId = touch.identifier;
                    } else if (joystickTouchId === null && !isTargetingBoostButton(x, y)) {
                        joystickCenter = { x: x, y: y };
                        joystickCurrent = { x: x, y: y };
                        joystickTouchId = touch.identifier;
                    }
                }
            }
        }
        
        function handleInputMove(e) {
            e.preventDefault();
            if (isGameOver || (!joystickCenter && !e.touches)) return; 

            if (e.type === 'mousemove') {
                if (!joystickCenter) return;
                const coords = { x: e.clientX, y: e.clientY };
                joystickCurrent = { x: coords.x, y: coords.y };
                updateJoystickDirection(coords.x, coords.y);
            } else if (e.type === 'touchmove') {
                const touches = e.touches;
                for (let i = 0; i < touches.length; i++) {
                    const touch = touches[i];
                    if (touch.identifier === joystickTouchId) {
                        const x = touch.clientX;
                        const y = touch.clientY;
                        joystickCurrent = { x: x, y: y };
                        updateJoystickDirection(x, y);
                    }
                }
            }
        }
        
        function updateJoystickDirection(x, y) {
            const dx = x - joystickCenter.x;
            const dy = y - joystickCenter.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            if (distance > JOYSTICK_DEADZONE_DISTANCE) { 
                mySnake.targetAngle = Math.atan2(dy, dx);
                if (distance > JOYSTICK_RADIUS) {
                    const ratio = JOYSTICK_RADIUS / distance;
                    joystickCurrent.x = joystickCenter.x + dx * ratio;
                    joystickCurrent.y = joystickCenter.y + dy * ratio;
                }
            } else {
                 joystickCurrent.x = joystickCenter.x;
                 joystickCurrent.y = joystickCenter.y;
            }
        }

        function handleInputUp(e) {
            if (isGameOver) return;
            if (e.type === 'mouseup') {
                endBoost();
                joystickCenter = null;
                joystickCurrent = null;
            } else if (e.type === 'touchend') {
                const changedTouches = e.changedTouches;
                for (let i = 0; i < changedTouches.length; i++) {
                    const touch = changedTouches[i];
                    if (touch.identifier === boostTouchId) {
                        endBoost();
                        boostTouchId = null;
                    } 
                    
                    if (touch.identifier === joystickTouchId) {
                        joystickCenter = null;
                        joystickCurrent = null;
                        joystickTouchId = null;
                    }
                }
            }
        }
        
        function generateFood(count, minSize, maxSize, type) {
            if (type === 'deceased') return;
            for (let i = 0; i < count; i++) {
                const size = minSize + Math.random() * (maxSize - minSize);
                let color = `hsl(${Math.random() * 360}, 90%, 60%)`;
                
                localFoodItems.push({
                    x: Math.random() * WORLD_SIZE,
                    y: Math.random() * WORLD_SIZE,
                    size: size,
                    color: color,
    
 
                    type: type || 'normal'
                });
            }
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (isGameOver) return;
            if (mySnake.isBoosting) {
                mySnake.length -= BOOST_CONSUMPTION_RATE;
                mySnake.score = Math.round(mySnake.length);
                
                if (mySnake.length <= MIN_LENGTH_TO_BOOST) { 
                    endBoost();
                }
            }

            if (mySnake.isInvulnerable && Date.now() > mySnake.invulnerableEndTime) {
                mySnake.isInvulnerable = false;
            }
            
            updateSnakeMovement();
            updateCamera();

            drawScene();
            drawJoystick(); 
            drawMinimap();

            checkEatFood();
            
            // 衝突判定は、自機の頭と他のヘビの体（補間されたトレイル）で行う
            if (!mySnake.isInvulnerable && checkCollision()) {
                gameOver(true);
                return;
            }
            
            document.getElementById('currentScore').textContent = Math.round(mySnake.length);
            requestAnimationFrame(gameLoop);
        }

        function getHeadRadius(length) {
            // 太くなる速度が向上
            const radius = BASE_RADIUS + length * RADIUS_GROWTH_RATE;
            return Math.min(radius, MAX_RADIUS);
        }

        function updateSnakeMovement() {
            let angleDiff = mySnake.targetAngle - mySnake.angle;
            if (angleDiff > Math.PI) angleDiff -= 2 * Math.PI;
            if (angleDiff < -Math.PI) angleDiff += 2 * Math.PI;
            // 旋回速度が向上
            mySnake.angle += Math.sign(angleDiff) * Math.min(Math.abs(angleDiff), TURN_RATE);
            const currentSpeed = mySnake.isBoosting ?
            BOOST_SPEED : BASE_SPEED;

            const dx = Math.cos(mySnake.angle) * currentSpeed;
            const dy = Math.sin(mySnake.angle) * currentSpeed;
            mySnake.x += dx;
            mySnake.y += dy;

            // 1. 新しい頭の位置をトレイルの先頭に追加
            const now = Date.now();
            mySnake.trail.unshift({ x: mySnake.x, y: mySnake.y });

            // 2. トレイルの総距離を mySnake.length になるように後方をトリミング
            let currentLength = 0;
            for (let i = 0; i < mySnake.trail.length - 1; i++) {
                const p1 = mySnake.trail[i];
                const p2 = mySnake.trail[i + 1];
                const segmentLength = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                if (currentLength + segmentLength >= mySnake.length) {
                    const excessDistance = mySnake.length - currentLength;
                    const ratio = excessDistance / segmentLength;
                    
                    // 終点を正確な位置に設定
                    const newTailX = p1.x + (p2.x - p1.x) * ratio;
                    const newTailY = p1.y + (p2.y - p1.y) * ratio;
                    // 超過分以降の要素を削除し、新しい終点を追加
                    mySnake.trail.splice(i + 1);
                    mySnake.trail.push({ x: newTailX, y: newTailY });
                    
                    break; 
                }

                currentLength += segmentLength;
            }

            // 境界チェック
            if (mySnake.x < 0 || mySnake.x > WORLD_SIZE || mySnake.y < 0 || mySnake.y > WORLD_SIZE) {
                gameOver(true);
            }
        }
        
        /**
         * 餌の吸引と消費のロジック
         */
        function checkEatFood() {
            const head = mySnake.trail[0];
            const headRadius = getHeadRadius(mySnake.length);
            
            // 吸引の定数
            const SUCK_RANGE = headRadius * 4; // 吸引範囲 (頭の半径の4倍)
            const SUCK_SPEED = 5; // 吸引速度 (ピクセル/フレーム)

            const allFood = [...foodItems, ...localFoodItems];
            const foodToKeep = [];
            const eatenDeceasedIds = []; // 削除する死体のIDリスト

            allFood.forEach(food => {
                let dx = head.x - food.x;
                let dy = head.y - food.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                let isEaten = false;

                // 1. **EATING CONDITION (Direct Contact)**
                if (dist < headRadius + food.size) { 
                    isEaten = true;
                } 
                // 2. **SUCKING CONDITION (Attraction & Guaranteed Eating)**
                else if (dist < SUCK_RANGE) {
                    // Attraction motion
                    const angle = Math.atan2(dy, dx);
                    const moveX = Math.cos(angle) * SUCK_SPEED;
                    const moveY = Math.sin(angle) * SUCK_SPEED;
                    
                    // Move the food item
                    food.x += moveX;
                    food.y += moveY;
                    
                    // Recalculate distance after movement
                    const newDx = head.x - food.x;
                    const newDy = head.y - food.y;
                    const newDist = Math.sqrt(newDx * newDx + newDy * newDy);
                    
                    // 吸引後の接触判定、または死体餌の確定消費判定
                    if (newDist < headRadius + food.size * 0.5) { // 接触判定を少し緩くする
                         isEaten = true;
                    } else if (food.isDeceased && newDist < SUCK_RANGE * 0.8) {
                        // 死体は動くとめんどい、という要望に基づき、吸引範囲内の一定距離で確定消費
                        isEaten = true; 
                    }
                }

                if (isEaten) {
                    // --- Consumption Logic ---
                    let foodValue;
                    
                    if (food.isDeceased) {
                        foodValue = food.value; 
                        eatenDeceasedIds.push(food.id);
                    } else {
                        foodValue = FOOD_VALUE; 
                        eatenFoodCount++; // Global variable
                    }

                    const currentHeadRadius = getHeadRadius(mySnake.length);
                    const initialHeadRadius = initialRadius; 
                    
                    // コスト = 今の太さ / 最初の太さ * 10
                    const costToGainOneLength = (currentHeadRadius / initialHeadRadius) * 10; 
                    // 成長量 = 得られたポイント / コスト
                    const growthAmount = foodValue / costToGainOneLength;
                    mySnake.length += growthAmount; 
                    mySnake.score = Math.round(mySnake.length);
                    
                } else {
                    // Food is kept (either untouched or moved by sucking)
                    foodToKeep.push(food);
                }
            });
            
            // Remove eaten deceased food from Firebase
            eatenDeceasedIds.forEach(id => {
                deceasedFoodRef.child(id).remove();
            });

            // Update localFoodItems with remaining non-deceased food
            localFoodItems = foodToKeep.filter(f => !f.isDeceased);
            
            // Food regeneration check
            if (localFoodItems.length < FOOD_COUNT) {
                generateFood(FOOD_COUNT - localFoodItems.length, 3, 5, 'normal');
            }
        }
        
        function checkCollision() {
            const head = mySnake.trail[0];
            // トレイルの先頭を使用
            const headRadius = getHeadRadius(mySnake.length);
            for (const playerId in otherPlayers) {
                const other = otherPlayers[playerId];
                // 他のヘビの体は受信したセグメント座標を使用
                const otherPath = other.bodySegments || []; 
                const otherHeadRadius = getHeadRadius(other.length || INITIAL_LENGTH); 
                
                if (other.isInvulnerable) continue;
                // 他のヘビの頭以外（i=1から）と衝突判定
                for (let i = 1; i < otherPath.length - 1; i++) { 
                    const segment = otherPath[i];
                    const dist = Math.sqrt(Math.pow(head.x - segment.x, 2) + Math.pow(head.y - segment.y, 2));
                    // 衝突判定を厳しくする (半径の80%を使用)
                    if (dist < (headRadius * 0.8) + (otherHeadRadius * 0.8)) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        /**
         * ゲームオーバー処理。死体を残し、オプションでメニューに戻る。
         * @param {boolean} showMenu - trueの場合、メニュー画面を表示する
         */
        function gameOver(showMenu = true) {
            if(isGameOver) return;
            isGameOver = true;
            clearInterval(window.syncInterval);
            
            endBoost();

            if (myPlayerId) {
                 playersRef.child(myPlayerId).onDisconnect().cancel();
            }

            // --- 死亡時の処理 (死体をまく) ---
            const deceasedLength = mySnake.length;
            const deadFoodValue = deceasedLength * 0.5; // 新しい死亡時の餌のポイント
            const deadFoodSize = getHeadRadius(deceasedLength) * 0.8;
            // mySnake.trail を使用して死体を生成
            mySnake.trail.forEach((point, index) => {
                // トレイルの点の数が多すぎるため、間引いて死体をまく (約10点に1点)
                if (index % 10 !== 0) return; 

                const deadFoodId = deceasedFoodRef.push().key; 
                // ★ 軽量化された死体データとして保存
    
                deceasedFoodRef.child(deadFoodId).set({
                    x: roundToOneDecimal(point.x + (Math.random() - 0.5) * 5), 
                    y: roundToOneDecimal(point.y + (Math.random() - 0.5) * 5),
                    s: roundToOneDecimal(deadFoodSize), // size -> s
        
                    v: roundToOneDecimal(deadFoodValue), // value -> v
                });
            });
            // プレイヤーをFirebaseから削除
            if (myPlayerId) {
                playersRef.child(myPlayerId).remove();
            }
            myPlayerId = null;
            // --- UI処理 ---
            if (showMenu) {
                document.getElementById('message').textContent = `ゲームオーバー！最終体長: ${Math.round(deceasedLength)}`;
                document.getElementById('ui-overlay').style.display = 'block';
                document.getElementById('mainMenu').style.display = 'block';
                document.getElementById('colorSettings').style.display = 'none';
            }
            boostButton.style.display = 'none';
            document.removeEventListener('mousedown', handleInputDown);
            document.removeEventListener('mousemove', handleInputMove);
            document.removeEventListener('mouseup', handleInputUp);
            document.removeEventListener('touchstart', handleInputDown);
            document.removeEventListener('touchmove', handleInputMove);
            document.removeEventListener('touchend', handleInputUp);
            
            joystickTouchId = null;
            boostTouchId = null;
        }

        function updateCamera() {
            const targetX = mySnake.x - canvas.width / 2;
            const targetY = mySnake.y - canvas.height / 2;
            cameraX += (targetX - cameraX) * CAMERA_SMOOTHING;
            cameraY += (targetY - cameraY) * CAMERA_SMOOTHING;
        }

        function worldToScreen(x, y) {
            return {
                x: x - cameraX,
                y: y - cameraY
            };
        }

        function drawScene() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.strokeStyle = '#222222';
            ctx.lineWidth = 10;
            const screenTopLeft = worldToScreen(0, 0);
            ctx.strokeRect(screenTopLeft.x, screenTopLeft.y, WORLD_SIZE, WORLD_SIZE);
            [...foodItems, ...localFoodItems].forEach(food => {
                // 描画カリングを食料にも適用
                const screenPos = worldToScreen(food.x, food.y);
                if (screenPos.x > -food.size && screenPos.x < canvas.width + food.size &&
                    screenPos.y > -food.size && screenPos.y < canvas.height + food.size) {
     
                    drawFood(food, screenPos);
                }
            });
            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                drawSnake(data);
            }
            
            drawSnake(mySnake);
        }
        
        function drawJoystick() {
            if (!joystickCenter || isGameOver) return;
            const centerX = joystickCenter.x;
            const centerY = joystickCenter.y;
            const currentX = joystickCurrent.x;
            const currentY = joystickCurrent.y;
            // 1. ジョイスティックの外枠 (ベース)
            ctx.beginPath();
            ctx.arc(centerX, centerY, JOYSTICK_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.stroke();

            // 2. ジョイスティックのつまみ (ノブ)
            ctx.beginPath();
            ctx.arc(currentX, currentY, JOYSTICK_KNOB_RADIUS, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
            ctx.stroke();
        }

        function drawSnake(snakeData) {
            // 自機: snakeData.trail 
            // 他のプレイヤー: snakeData.bodySegments (受信した座標配列)
            const path = snakeData.bodySegments || snakeData.trail || []; 
            if (path.length < 2) {
                // パスが短すぎる場合は頭のみ描画
                if (path.length >= 1) {
                    const head = path[0];
                    const screenPos = worldToScreen(head.x, head.y);
                    const headRadius = getHeadRadius(snakeData.length || INITIAL_LENGTH);
                    ctx.fillStyle = snakeData.customColors[0];
                    ctx.beginPath();
                    ctx.arc(screenPos.x, screenPos.y, headRadius, 0, 2 * Math.PI);
                    ctx.fill();
                }
                return;
            }

            const snakeLength = snakeData.length || INITIAL_LENGTH;
            const headRadius = getHeadRadius(snakeLength);
            const customColors = snakeData.customColors || INITIAL_CUSTOM_COLORS;
            const colorCount = customColors.length;
            const isBoosting = snakeData.isBoosting;
            
            // 線描画の設定: 角を丸くして滑らかな線にする
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            
            const OUTLINE_WIDTH_ADDITION = 3; // 輪郭線の太さ（追加分）
            const OUTLINE_COLOR = 'rgba(255, 255, 255, 0.3)'; // 薄い白

            // --- 1. 輪郭線 (Outline) パス (ヘビの体) ---
            ctx.strokeStyle = OUTLINE_COLOR;

            for (let i = 0; i < path.length - 1; i++) {
                const segment1 = path[i];
                const segment2 = path[i + 1];

                const screenPos1 = worldToScreen(segment1.x, segment1.y);
                const screenPos2 = worldToScreen(segment2.x, segment2.y);
                
                // 太さの計算（非常に緩やかに細くなるように係数を調整）
                const radius1 = headRadius * (1 - i * 0.0001);
                const radius2 = headRadius * (1 - (i + 1) * 0.0001);
                const currentLineWidth = (radius1 + radius2);
                
                // 輪郭線は本体より太い幅で描画
                ctx.lineWidth = currentLineWidth + OUTLINE_WIDTH_ADDITION; 

                ctx.beginPath();
                ctx.moveTo(screenPos1.x, screenPos1.y);
                ctx.lineTo(screenPos2.x, screenPos2.y);
                ctx.stroke();
            }

            // --- 2. 本体 (Main Body) パス (ヘビの体) ---
            for (let i = 0; i < path.length - 1; i++) {
                const segment1 = path[i];
                const segment2 = path[i + 1];

                const screenPos1 = worldToScreen(segment1.x, segment1.y);
                const screenPos2 = worldToScreen(segment2.x, segment2.y);
                
                const radius1 = headRadius * (1 - i * 0.0001);
                const radius2 = headRadius * (1 - (i + 1) * 0.0001);
                const currentLineWidth = (radius1 + radius2);
                
                // 本体は元の太さで描画
                ctx.lineWidth = currentLineWidth;

                // 色の切り替え (2セグメントで1色、頭の色が長くならないように+2でオフセット)
                let colorIndex;
                if (snakeData === mySnake) {
                    // 自機は高密度の trail を使っているので、色を滑らかにグラデーションさせるために細かく計算
                    colorIndex = Math.floor((i + 2) / 2) % colorCount;
                } else {
                    // 他のプレイヤーは疎な bodySegments を使っているので、セグメント数を基準に色を割り当てる
                    colorIndex = Math.floor(i / 2) % colorCount;
                }
                
                let color = customColors[colorIndex];
                
                // 無敵/ブースト効果の適用
                if (snakeData.isInvulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
                    color = 'rgba(255, 255, 255, 0.7)';
                } else if (isBoosting) {
                    color = `rgba(46, 204, 113, 1)`;
                }

                ctx.strokeStyle = color;

                // 線セグメントの描画
                ctx.beginPath();
                ctx.moveTo(screenPos1.x, screenPos1.y);
                ctx.lineTo(screenPos2.x, screenPos2.y);
                ctx.stroke();
            }
            
            // ヘビの頭を最後に描画して、体の上に重ねて目立たせる
            const head = path[0];
            const headScreen = worldToScreen(head.x, head.y);
            const headRadiusFinal = headRadius * (1 - 0 * 0.0001);

            // 頭の輪郭線
            ctx.strokeStyle = OUTLINE_COLOR;
            // 頭の輪郭線は少し細くする
            ctx.lineWidth = 2; 
            // 輪郭線の太さ分、半径を広げて描画
            ctx.beginPath();
            ctx.arc(headScreen.x, headScreen.y, headRadiusFinal + OUTLINE_WIDTH_ADDITION/2, 0, 2 * Math.PI);
            ctx.stroke();
            
            // 頭の本体
            ctx.fillStyle = customColors[0];
            ctx.beginPath();
            ctx.arc(headScreen.x, headScreen.y, headRadiusFinal, 0, 2 * Math.PI);
            ctx.fill();


            // 名前の描画
            if (snakeData.name) {
                ctx.fillStyle = 'white';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                if (snakeData.isInvulnerable) {
                    ctx.shadowColor = 'cyan';
                    ctx.shadowBlur = 10;
                }
                ctx.fillText(snakeData.name, headScreen.x, headScreen.y - headRadiusFinal - 5);
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
                ctx.textAlign = 'start';
            }

            // 次の描画のためにラインスタイルをリセット
            ctx.lineCap = 'butt';
            ctx.lineJoin = 'miter'; 
            ctx.lineWidth = 1; 
        }

        function drawFood(food, screenPos) {
            ctx.fillStyle = food.color;
            ctx.beginPath();
            ctx.arc(screenPos.x, screenPos.y, food.size, 0, 2 * Math.PI);
            ctx.fill();
        }
        
        function drawMinimap() {
            const mapSize = minimapCanvas.width;
            minimapCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            minimapCtx.fillRect(0, 0, mapSize, mapSize);
            
            const scale = mapSize / WORLD_SIZE;

            minimapCtx.strokeStyle = '#ffffff';
            minimapCtx.strokeRect(0, 0, mapSize, mapSize);
            
            // マップ上のヘビの基本色は常に赤
            const SNAKE_MAP_COLOR = '#FF0000'; 

            for (const playerId in otherPlayers) {
                const data = otherPlayers[playerId];
                const mapX = data.x * scale;
                const mapY = data.y * scale;
                
                let dotColor = SNAKE_MAP_COLOR; // 基本色を赤に設定
                
                // 無敵状態の点滅処理は白を優先
                if (data.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                    dotColor = '#ffffff'; 
                }
                
                minimapCtx.fillStyle = dotColor;
                minimapCtx.beginPath();
                minimapCtx.arc(mapX, mapY, 2, 0, 2 * Math.PI);
                minimapCtx.fill();
            }

            const myMapX = mySnake.x * scale;
            const myMapY = mySnake.y * scale;

            let myDotColor = SNAKE_MAP_COLOR; // 自機も赤に設定
            
            // 無敵状態の点滅処理は白を優先
            if (mySnake.isInvulnerable && Math.floor(Date.now() / 200) % 2 === 0) {
                myDotColor = '#ffffff';
            }

            minimapCtx.fillStyle = myDotColor;
            minimapCtx.beginPath();
            minimapCtx.arc(myMapX, myMapY, 4, 0, 2 * Math.PI);
            minimapCtx.fill();


            const viewWidth = canvas.width * scale;
            const viewHeight = canvas.height * scale;
            const viewX = cameraX * scale;
            const viewY = cameraY * scale;

            minimapCtx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            minimapCtx.strokeRect(viewX, viewY, viewWidth, viewHeight);
        }

        function updateFirebase() {
            if (!myPlayerId || isGameOver) return;
            // 高密度トレイルから固定間隔(8)でセグメント座標をサンプリング
            const bodySegments = [];
            let currentDistance = 0;
            
            if (mySnake.trail.length > 0) {
                // ★ 座標を小数点第1位に丸める
                const headX = roundToOneDecimal(mySnake.trail[0].x);
                const headY = roundToOneDecimal(mySnake.trail[0].y);
                bodySegments.push({ x: headX, y: headY });
                // 常に頭は追加 (インデックス0)

                for (let i = 1; i < mySnake.trail.length; i++) {
                    const p1 = mySnake.trail[i - 1];
                    const p2 = mySnake.trail[i];
                    const segmentLength = Math.sqrt(Math.pow(p2.x - p1.x, 2) + Math.pow(p2.y - p1.y, 2));
                    if (currentDistance + segmentLength >= SEGMENT_DISTANCE) {
                        // SEGMENT_DISTANCE に達した位置を計算して追加
                        const excessDistance = SEGMENT_DISTANCE - currentDistance;
                        const ratio = excessDistance / segmentLength;
                        
                        const segmentX = p1.x + (p2.x - p1.x) * ratio;
                        const segmentY = p1.y + (p2.y - p1.y) * ratio;
                        // ★ 座標を小数点第1位に丸める
                        bodySegments.push({ x: roundToOneDecimal(segmentX), y: roundToOneDecimal(segmentY) });
                        // 残りの距離を次のセグメントの計算に繰り越し
                        currentDistance = segmentLength - excessDistance;
                    } else {
                        currentDistance += segmentLength;
                    }
                }
                // 最後に計算された座標と、実際の尻尾の座標の距離が SEGMENT_DISTANCE 未満であれば尻尾を追加
                if (mySnake.trail.length > 0 && bodySegments.length > 0) {
                    const tail = mySnake.trail[mySnake.trail.length - 1];
                    const lastSegment = bodySegments[bodySegments.length - 1];
                    const distToTail = Math.sqrt(Math.pow(tail.x - lastSegment.x, 2) + Math.pow(tail.y - lastSegment.y, 2));
                    if (distToTail < SEGMENT_DISTANCE) {
                        bodySegments.push({x: roundToOneDecimal(tail.x), y: roundToOneDecimal(tail.y)});
                    }
                }
            }
            
            // ★ 色をBase64にエンコード
            const colorBase64 = hexArrayToBase64(mySnake.customColors);
            // ★ タイムスタンプ(t)を削除し、短縮されたフィールド名のみを送信
            playersRef.child(myPlayerId).set({
                n: playerName,
                x: roundToOneDecimal(mySnake.x),
                y: roundToOneDecimal(mySnake.y),
                l: roundToOneDecimal(mySnake.length), 
                c: colorBase64, 
                b: bodySegments, 
                i: mySnake.isInvulnerable || null, // trueの場合のみ送信
                s: mySnake.isBoosting || null, // trueの場合のみ送信
            });
        }
        
        // Catmull-Rom 関数は削除しました


        // 以下のリスナーブロックはsetupFirebaseListeners関数に移動しました
        /* playersRef.on('value', (snapshot) => { ... });
        deceasedFoodRef.on('value', (snapshot) => { ... });
        */
        

        function hslToHex(h, s, l) {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`;
        }

        function generateColorPalette() {
            colorPalette.innerHTML = '';
            SATURATION_LAYERS.forEach(s => {
                BASE_HUES.forEach(h => {
                    const colorHex = hslToHex(h, s, currentLightness);
                    
                    const colorOption = document.createElement('div');
            
                    colorOption.className = 'color-option';
                    colorOption.style.backgroundColor = colorHex;
                    colorOption.dataset.color = colorHex;
                    colorOption.addEventListener('click', () => selectColor(colorHex));
       
                
                    colorPalette.appendChild(colorOption);
                });
            });
            [100, 80, 60, 40, 20, 0].forEach(l => {
                const colorHex = hslToHex(0, 0, l);
                const colorOption = document.createElement('div');
                colorOption.className = 'color-option';
                colorOption.style.backgroundColor = colorHex;
   
              
                colorOption.dataset.color = colorHex;
                colorOption.addEventListener('click', () => selectColor(colorHex));
                colorPalette.appendChild(colorOption);
            });
            document.getElementById('currentLightnessDisplay').textContent = currentLightness;
        }


        function setupColorSettings() {
            colorPreview.innerHTML = '';
            for (let i = 0; i < DOT_COUNT; i++) {
                const segmentDiv = document.createElement('div');
                segmentDiv.className = 'color-segment-preview';
                segmentDiv.style.backgroundColor = mySnake.customColors[i];
                segmentDiv.dataset.index = i;
                
                if (i > 0 && i % 6 === 0) { 
                    segmentDiv.style.clear = 'left';
                    segmentDiv.style.marginTop = '5px';
                }

                if (i === currentEditingSegment) {
                    segmentDiv.classList.add('selected');
                }
                segmentDiv.addEventListener('click', () => selectSegmentToEdit(i));
                colorPreview.appendChild(segmentDiv);
            }
            
            generateColorPalette();
        }
        
        function selectSegmentToEdit(index) {
            currentEditingSegment = index;
            document.querySelectorAll('.color-segment-preview').forEach((el, i) => {
                el.classList.toggle('selected', i === index);
            });
        }

        function selectColor(color) {
            mySnake.customColors[currentEditingSegment] = color;
            document.querySelector(`.color-segment-preview[data-index="${currentEditingSegment}"]`).style.backgroundColor = color;
        }

        function adjustBrightness(change) {
            currentLightness = Math.max(0, Math.min(100, currentLightness + change));
            generateColorPalette();
        }

        document.getElementById('brightnessDownButton').addEventListener('click', () => {
            adjustBrightness(-10); 
        });
        document.getElementById('brightnessUpButton').addEventListener('click', () => {
            adjustBrightness(10); 
        });
        document.getElementById('colorSettingsButton').addEventListener('click', () => {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('colorSettings').style.display = 'block';
            setupColorSettings();
        });
        document.getElementById('backToMenuButton').addEventListener('click', () => {
            document.getElementById('mainMenu').style.display = 'block';
            document.getElementById('colorSettings').style.display = 'none';
        });
        document.getElementById('startButton').addEventListener('click', () => {
            playerName = document.getElementById('playerName').value.trim();
            if (!playerName) {
                document.getElementById('message').textContent = '名前を入力してください！';
                return;
            }
            
           // --- サーバー選択とFirebase初期化の追加 ---
            const serverSelect = document.getElementById('serverSelect');
            const selectedServerId = serverSelect.value;
            const selectedConfig = FIREBASE_CONFIGS[selectedServerId].config;
            
            // 選択されたサーバーでFirebaseを初期化し、参照を設定
            initializeFirebase(selectedConfig); 
            // ----------------------------------------

            document.getElementById('ui-overlay').style.display = 'none';
            document.getElementById('message').textContent = '';
            initGame();
        });
        setupColorSettings();

        // ★★★ 追加するコードブロック ★★★

        /**
         * ブラウザがフォーカスを失った際に、ジョイスティックとブーストを強制リセットする
         * これにより、マウスアップやタッチアップイベントが欠落した場合の操作ロックを防ぐ。
         */
        function resetControlsOnBlur() {
            if (isGameOver) return;
            
            console.log("Window blur detected. Resetting controls.");
            
            // 1. ジョイスティックの状態をリセット
            joystickCenter = null;
            joystickCurrent = null;
            joystickTouchId = null;
            
            // 2. ブースト状態を解除
            endBoost();
            boostTouchId = null;
            
            // mySnake.angle はそのままなので、ヘビは直進を続けます。
            // ページに戻った後、プレイヤーはすぐに新しい入力を開始できます。
        }

        // ブラウザの 'blur' イベントにリスナーを追加
        window.addEventListener('blur', resetControlsOnBlur);
        
        // ★★★ ここまで追加するコードブロック ★★★

    </script>
</body>
</html>
